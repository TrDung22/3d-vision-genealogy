title: "InstantMesh: Efficient 3D Mesh Generation from a Single Image with Sparse-view Large Reconstruction Models"
short: "InstantMesh (2024)"
authors: "Jiale Xu, Weihao Cheng, Yiming Gao, Xintao Wang, Shenghua Gao, Ying Shan (Tencent ARC)"
venue: "arXiv 2024"
year: 2024
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2404.07191"
  code: "https://github.com/TencentARC/InstantMesh"
problem: >
  LRM proved feed-forward 3D but stayed closed and output NeRFs; practitioners
  needed an open pipeline that ends in a clean mesh.
solution: >
  Compose the two open threads: a multiview diffusion front-end (a fine-tuned
  Zero123++) imagines sparse views, an LRM-style transformer reconstructs from
  them, and differentiable iso-surface extraction (FlexiCubes) trains the
  model to output meshes directly — open weights, ~10 seconds per asset.
limitations: >
  Quality is bounded by the multiview front-end's consistency; geometry is
  smooth-biased; and like all Objaverse-trained models it lives in clean
  object-centric imagery.
relations:
  - node: lrm2023
    type: builds-on
    note: >
      Builds on the LRM architecture, initialized from the open-source OpenLRM
      weights; following Instant3D, it feeds the model sparse imagined views
      instead of one image, and its own step is mesh-native training
      (FlexiCubes) instead of NeRF output.
  - node: triposr2024
    type: fixes
    note: >
      Five weeks later, it benchmarks TripoSR and names its weakness: from one
      image it "lacks the imagination ability and tends to generate degraded
      geometry and textures on the back" when the input is free-style.
      Imagining the unseen views with multiview diffusion first, then
      reconstructing from them, is the repair.
  - node: objaverse2023
    type: builds-on
    note: >
      Both halves train on this data: its sparse-view reconstructor on ~270K
      high-quality instances filtered from Objaverse's 800K, and its Zero123++
      fine-tune on renders of Objaverse's LVIS subset.
status: seed
