title: "DynIBaR: Neural Dynamic Image-Based Rendering"
short: "DynIBaR (2022)"
authors: "Zhengqi Li, Qianqian Wang, Forrester Cole, Richard Tucker, Noah Snavely"
venue: "CVPR 2023 (Best Paper Honorable Mention)"
year: 2022
branch: dynamic-4d
lane: flow
links:
  arxiv: "https://arxiv.org/abs/2211.11082"
  paper: "https://openaccess.thecvf.com/content/CVPR2023/html/Li_DynIBaR_Neural_Dynamic_Image-Based_Rendering_CVPR_2023_paper.html"
  project: "https://dynibar.github.io/"
  code: "https://github.com/google/dynibar"
problem: >
  Dynamic NeRFs had conquered short, tame clips: "for long videos with
  complex object motions and uncontrolled camera trajectories, these
  methods can produce blurry or inaccurate renderings". Scene-flow methods
  like NSFF did not scale past second-long, forward-facing videos;
  canonical-template methods like HyperNeRF stayed object-centric, with
  controlled camera paths. Both packed the whole moving scene into the
  weights of MLPs.
solution: >
  Stop memorizing the scene and borrow it from the input frames. DynIBaR
  extends IBRNet-style volumetric image-based rendering to motion: each
  sample on a target ray gathers features from nearby source views, along
  motion-adjusted curves, since moving points violate the epipolar
  constraints static IBR relies on, and a ray transformer turns them into
  color and density. Motion is a trajectory field over a learned basis
  (initialized as DCT), so one MLP query places a point in every nearby
  frame; cross-time rendering keeps it temporally coherent, and a Bayesian
  motion-segmentation module splits static from dynamic. LPIPS fell by over
  50% on two dynamic-scene benchmarks, and in-the-wild clips of 10-30
  seconds became renderable.
limitations: >
  By its own account viewpoint changes must stay relatively small, small
  fast-moving objects fail when the initial depth and flow are wrong, the
  views are "not strictly multi-view consistent", colinear camera and
  object motion is degenerate, and a 10-second video costs about two days
  on eight A100s. Shape of Motion (2024) later grouped it with NSFF as
  modeling motion as short-range scene flow, "failing to capture 3D motion
  trajectories persistent over a video", and on DyCheck's iPhone captures
  measured it at 13.41 dB masked PSNR, below HyperNeRF's 15.99. MoSca
  (2024) faulted it for fusing information "only from a small temporal
  window".
relations:
  - node: nsff2020
    type: fixes
    note: >
      Repairs the limit NSFF admitted, quality that "degrades when either the
      length of the sequence is increased given default number of model
      parameters" or motion turns extreme, and which DynIBaR, from NSFF's
      first author, names outright: scene-flow methods like NSFF "struggle
      to scale to longer input videos captured with unconstrained camera
      motions". It keeps NSFF's skeleton (separate static and dynamic
      models, motion-disocclusion weights, flow-based splatting for new
      times, the evaluation protocol) but stops storing the scene in MLP
      weights. On the Nvidia benchmark, dynamic-region LPIPS fell from
      NSFF's 0.159 to 0.062.
  - node: hypernerf2021
    type: fixes
    note: >
      Answers the second half of DynIBaR's diagnosis: "Methods like
      HyperNeRF that construct a canonical model are mostly constrained to
      object-centric scenes with controlled camera paths, and can fail on
      scenes with complex object motion." DynIBaR keeps no canonical
      template at all; each moment is rendered from the frames around it,
      an approach it pitches as scalable to long videos, unbounded scenes,
      uncontrolled camera trajectories and fast, complex motion. On the
      Nvidia benchmark, full-scene PSNR rose from HyperNeRF's 20.90 to
      30.91.
  - node: ibrnet2021
    type: builds-on
    note: >
      Stands on IBRNet outright: "The network architecture for two main
      representations is a variant of that of IBRNet", the method DynIBaR
      calls the most relevant of all those building on NeRF. It "extends
      this kind of volumetric IBR framework designed for static scenes" to
      dynamic video, gathering features along motion-adjusted curves because
      "moving scene elements violate epipolar constraints", and it trades
      IBRNet's cross-scene generalization for a model fit to each video. In
      its ablation on the Nvidia benchmark, IBRNet with an added time
      embedding reaches 25.33 dB PSNR; the full system, 30.77.
status: seed
