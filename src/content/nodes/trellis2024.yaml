title: "Structured 3D Latents for Scalable and Versatile 3D Generation (TRELLIS)"
short: "TRELLIS (2024)"
authors: "Jianfeng Xiang, Zelong Lv, Sicheng Xu, Yu Deng, Ruicheng Wang, Bowen Zhang, Dong Chen, Xin Tong, Jiaolong Yang (Microsoft)"
venue: "CVPR 2025 (Highlight)"
year: 2024
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2412.01506"
  code: "https://github.com/microsoft/TRELLIS"
problem: >
  Prior generators were mostly locked to one output format — NeRF here,
  Gaussians there, meshes elsewhere — fragmenting the field and capping
  quality at whatever that format tolerates.
solution: >
  A unified Structured LATent (SLAT): a sparse 3D grid of latents fusing
  geometry and appearance, decodable into radiance fields, 3D Gaussians, OR
  meshes from the same generation. Rectified-flow transformers scaled to 2B
  parameters on 500K curated objects, with local 3D editing prior models
  couldn't offer. Adoption is the signal: ~11k GitHub stars and 1M+ Hugging
  Face downloads within a year, spawning a family of SLAT successors.
limitations: >
  Trained on curated, object-centric assets — clean-background single objects,
  not the cluttered real world; and, by its own account, its image-to-3D model
  bakes the reference image's lighting into the asset (no PBR materials),
  while its two-stage pipeline can be less efficient than end-to-end
  generation.
relations:
  - node: clay2024
    type: fixes
    note: >
      Repairs the weakness it diagnoses in the geometry-first line CLAY
      belongs to: generators built on meshes or implicit fields "often falter
      in detailed appearance modeling", and CLAY "focuses solely on shape
      encoding". One Structured Latent (SLAT) carries geometry and appearance
      together and decodes to radiance fields, 3D Gaussians, or meshes from a
      single generation.
  - node: objaverse2023
    type: builds-on
    note: >
      A large model standing on large 3D data: TRELLIS trains its
      2B-parameter model on ~500K curated objects, about 480K of them filtered
      from Objaverse-XL (the rest from ABO, 3D-FUTURE and HSSD).
  - node: banani2024
    type: builds-on
    note: >
      Builds on a finding rather than a method: TRELLIS encodes each 3D asset
      by averaging DINOv2 features gathered from many rendered views, and
      picks DINOv2 "given its demonstrated strong 3D awareness" — citing this
      probe as the evidence.
  - node: 3dgs2023
    type: builds-on
    note: >
      Its structured latents are learned through splatting: each active SLAT
      voxel decodes into 32 3D Gaussians (offsets, colors, scales, opacities,
      rotations) rendered against ground-truth views, and "we adopt Gaussians
      to learn the encoder and decoder end-to-end due to their high fidelity
      and efficiency"; the radiance-field and mesh decoders are trained
      afterwards on the frozen encoder. 3DGS's density control gives way to
      volume and opacity regularizers, since "original density control
      schemes are not applicable when Gaussians are predicted by neural
      networks".
status: seed
