title: "Nerfies: Deformable Neural Radiance Fields"
short: "Nerfies (2020)"
authors: "Keunhong Park, Utkarsh Sinha, Jonathan T. Barron, Sofien Bouaziz, Dan B Goldman, Steven M. Seitz, Ricardo Martin-Brualla"
venue: "ICCV 2021 (Oral, per authors' homepages)"
year: 2020
branch: dynamic-4d
lane: deformation
links:
  arxiv: "https://arxiv.org/abs/2011.12948"
  project: "https://nerfies.github.io/"
problem: >
  Photorealistic free-viewpoint "selfies" from a casually waved phone: the
  subject breathes, sways, blinks — nonrigidity everywhere, and NeRF's
  static assumption shatters.
solution: >
  A per-observation deformation field warping each frame into a shared
  canonical NeRF, tamed by elastic regularization (penalizing non-rigid
  local deformation), a background prior, and coarse-to-fine annealing of
  the deformation's frequencies — casually captured humans, reconstructed.
limitations: >
  By its own account it "struggles with topological changes e.g.,
  opening/closing of the mouth", since the seam of the lips needs "a sharp
  discontinuity in the deformation", which is "difficult for our continuous
  MLP to predict"; it may also fail on frames with rapid motion, and trains
  slowly (a week on 8 V100s for full-HD models). HyperNeRF, from the same
  team, took that diagnosis as its starting point.
relations:
  - node: nerf2020
    type: fixes
    note: >
      Repairs the static-scene assumption for REAL captures: where NeRF
      needs a frozen world, Nerfies budgets for the involuntary motion of a
      living subject and recovers the crisp static answer underneath.
  - node: nerfw2020
    type: builds-on
    note: >
      Stands on NeRF-W's per-image appearance code. "Similar to NeRF-W",
      Nerfies gives every frame a learned appearance latent "that modulates
      the color output to handle appearance variations between input
      frames, e.g., exposure and white balance", fed to the canonical NeRF
      alongside the view direction, as in NeRF-W's NeRF-A variant. It pairs
      that code with a second per-frame latent of its own: a deformation
      code that warps each observation into the canonical template.
status: seed
