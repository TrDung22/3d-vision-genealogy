title: "Memorization in 3D Shape Generation: An Empirical Study"
short: "Pu et al. 2025"
authors: "Shu Pu, Boya Zeng, Kaichen Zhou, Mengyu Wang, Zhuang Liu (Princeton, Harvard)"
venue: "CVPR 2026 (Findings track)"
year: 2025
branch: single-image-3d
lane: generative
kind: analysis
links:
  arxiv: "https://arxiv.org/abs/2512.23628"
  paper: "https://openaccess.thecvf.com/content/CVPR2026F/html/Pu_Memorization_in_3D_Shape_Generation_An_Empirical_Study_CVPRF_2026_paper.html"
  project: "https://urrealhero.github.io/3DGenMemorizationWeb/"
  code: "https://github.com/zlab-princeton/3d-gen-mem"
problem: >
  The question Tatarchenko put to ShapeNet-era networks, asked again at web
  scale: when a 3D generator trained on hundreds of thousands of assets
  produces a shape, is it generating one — or reproducing one it was trained
  on? By the authors' account, memorization in 3D generative models "has not
  yet been systematically studied".
solution: >
  An evaluation framework: match each generated shape to its nearest training
  shape by Light Field Distance — chosen because it agreed best with human
  judgments of near-identical shapes (78.4% top-1, vs 46.8% for Chamfer
  distance) — and score each model with a Mann–Whitney statistic, Z_U, that
  compares generated against held-out shapes (Z_U < 0 = evidence of
  memorization). Verdict: "Earlier models exhibit strong memorization,
  whereas recent models demonstrate effective generalization"; and in
  controlled runs, "higher semantic diversity leads 3D diffusion models to
  memorize more" at a fixed data budget.
limitations: >
  By its own account: its verdicts inherit LFD's inaccuracies; sampling
  text-conditioned models from training prompts "may bias ZU downward even
  for models that do generalize"; and its controlled experiments use a
  "relatively small model", not fully comparable to cutting-edge ones. The
  image-conditioned reconstructors (LRM and its heirs) are cited, not audited.
relations:
  - node: trellis2024
    type: challenges
    note: >
      Puts TRELLIS on the stand — and mostly acquits it. Every size scores
      Z_U < 0 (−0.67, −1.57, −2.19 from small to xlarge), the paper's own
      criterion for evidence of memorization, yet with samples drawn from
      training prompts (which, the authors note, may bias Z_U downward) they
      judge that it already shows "reasonable generalization". The yardstick
      fares worse: training-set FD, a common score for 3D generators, cannot
      tell generation from copying — "exactly reproducing the training data
      can drive training FD to zero".
    i18n:
      ja:
        note: "TRELLIS を証言台に立たせ — そしておおむね無罪とします。どのサイズも Z_U < 0 (small から xlarge へ −0.67、−1.57、−2.19)、つまり論文自身の基準では記憶の証拠です。ただしサンプルは学習プロンプトから取っており (Z_U を下振れさせうると著者たちは注記)、著者たちは「妥当な汎化」をすでに示していると判断しました。分が悪いのは物差しのほうです。3D生成モデルによく使われる学習セット上の FD は、生成とコピーを区別できない — 「学習データを正確に再現すれば、学習 FD はゼロにできる」のです。"
  - node: objaverse2023
    type: builds-on
    note: >
      Its controlled experiments train on a ~140K-object Objaverse-XL subset:
      the data trunk on which it measures how semantic diversity and data
      budget drive 3D memorization.
    i18n:
      ja:
        note: "統制実験は、約14万物体の Objaverse-XL サブセットで学習します。意味的な多様性とデータ量が3Dの記憶をどう左右するかを測る、データの幹です。"
status: seed
i18n:
  ja:
    problem: "Tatarchenko が ShapeNet 時代のネットワークに突きつけた問いを、ウェブ規模で問い直します。数十万のアセットで学習した3D生成モデルが形状を出すとき、それは生成なのか — それとも学習した形状の再現なのか。著者たちによれば、3D生成モデルの記憶 (memorization) は「まだ体系的に研究されていない」のです。"
    solution: "評価の枠組みを作ります。生成した形状ごとに、Light Field Distance で最も近い学習形状を対応づける — 人間がほぼ同一と判定した形状との一致が最も高かった指標です (top-1 で 78.4%、Chamfer 距離は 46.8%)。そしてモデルごとに、生成形状と held-out 形状を比べる Mann–Whitney 統計量 Z_U でスコアをつけます (Z_U < 0 なら記憶の証拠)。結論は「初期のモデルは強く記憶し、最近のモデルは効果的に汎化している」。統制実験では、データ量を固定すると「意味的な多様性が高いほど3D拡散モデルはより多く記憶する」ことも示されました。"
    limitations: "本人たちの言うとおり — 判定は LFD の不正確さをそのまま受け継ぎ、テキスト条件のモデルを学習プロンプトからサンプリングすると「汎化しているモデルでも ZU を下振れさせうる」。統制実験のモデルも「比較的小さく」、最先端のモデルとは完全には比べられません。画像条件の再構成手法 (LRM とその後継) は引用されるだけで、監査はされていません。"
