title: "SyncDreamer: Generating Multiview-consistent Images from a Single-view Image"
short: "SyncDreamer (2023)"
authors: "Yuan Liu, Cheng Lin, Zijiao Zeng, Xiaoxiao Long, Lingjie Liu, Taku Komura, Wenping Wang"
venue: "ICLR 2024 (Spotlight)"
year: 2023
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2309.03453"
  project: "https://liuyuan-pal.github.io/SyncDreamer/"
problem: >
  Zero-1-to-3's imagined views each look plausible alone but contradict each
  other in 3D — reconstruction from them inherits the contradictions.
solution: >
  Synchronize the imagination: a multiview diffusion model that denoises all
  target views jointly, correlating their noise states through a 3D-aware
  attention so the generated views agree with one another.
limitations: >
  Consistency is enforced at feature level, not guaranteed geometrically;
  resolution and view counts are fixed; and per-object reconstruction is still
  a separate downstream step.
relations:
  - node: zero123-2023
    type: fixes
    note: >
      Repairs the weakness SyncDreamer names in Zero123 — its views are
      plausible "but the generated images are not multiview-consistent" — at
      its source: instead of generating views one by one, denoise them
      together with synchronized noise states.
    i18n:
      ja:
        note: "SyncDreamer が Zero123 に名指しした弱点 — 視点はもっともらしい「が、生成された画像は多視点で一貫していない」 — を、発生源で直します。視点を一枚ずつ生成するのではなく、同期したノイズ状態でまとめてデノイズするのです。"
status: seed
i18n:
  ja:
    problem: "Zero-1-to-3 の想像した視点は、一枚ずつ見ればもっともらしいのに、3Dでは互いに矛盾します — そこから再構成すれば、矛盾ごと相続してしまうのです。"
    solution: "想像を同期させます。多視点拡散モデルがすべての目標視点をまとめてデノイズし、3Dを意識したアテンションでノイズ状態どうしを相関させて、生成される視点どうしを互いに一致させるのです。"
    limitations: "一貫性は特徴レベルで強制されるだけで、幾何的に保証されてはいません。解像度も視点数も固定で、物体ごとの再構成は依然として別の下流工程です。"
