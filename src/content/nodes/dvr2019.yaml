title: "Differentiable Volumetric Rendering: Learning Implicit 3D Representations without 3D Supervision"
short: "DVR (2019)"
authors: "Michael Niemeyer, Lars Mescheder, Michael Oechsle, Andreas Geiger"
venue: "CVPR 2020"
year: 2019
branch: neural-rendering
lane: surfaces
links:
  arxiv: "https://arxiv.org/abs/1912.07372"
  paper: "https://openaccess.thecvf.com/content_CVPR_2020/html/Niemeyer_Differentiable_Volumetric_Rendering_Learning_Implicit_3D_Representations_Without_3D_Supervision_CVPR_2020_paper.html"
  code: "https://github.com/autonomousvision/differentiable_volumetric_rendering"
problem: >
  Implicit networks such as Occupancy Networks and DeepSDF learned shape
  from 3D ground truth, which is costly or impossible to get for real-world
  data, and "it remains unclear how to learn implicit representations from
  image data alone". Differentiable renderers that learn from images
  existed, but for voxels and meshes, with their discretization and
  resolution limits. SRN learned an implicit scene from images through an
  LSTM ray marcher, but its geometry, DVR notes, "cannot be extracted
  directly".
solution: >
  Render the occupancy network as a surface: march along each ray to the first
  point where occupancy crosses 0.5, refine it with the secant method, and
  color it with a texture field from the same network. The trick is the
  gradient. Differentiating the level-set condition implicitly gives the
  depth's derivative in closed form, so nothing along the ray is stored and
  memory does not grow with sampling accuracy. Trained on images, cameras and
  object masks, its single-view ShapeNet model comes close to 3D-supervised
  ones (Chamfer-L1 0.239 against Occupancy Networks' 0.215), and per-object
  fits on three DTU scans come out as watertight meshes.
limitations: >
  By its own account it still needs object masks and camera information,
  and recovers texture rather than materials: the future work it names.
  NeRF noted that each surface point gets "a diffuse color" and found DVR
  and SRN "limited to simple shapes with low geometric complexity". IDR
  argued that a renderer blind to the viewing direction cannot model
  specularity, found that DVR "often produces shape artifact in specular
  scenes", and measured its mean Chamfer distance on 15 DTU scans at 3.20
  against IDR's 0.90. UNISURF traced the masks to surface rendering itself,
  which can "only provide gradient information locally where a surface
  intersects with a ray".
relations:
  - node: occnet2019
    type: builds-on
    note: >
      Same group (Niemeyer, Mescheder, Oechsle and Geiger are on both papers):
      the shape is an Occupancy Network, the surface its 0.5 level set, and
      the ShapeNet splits and the Chamfer-L1 metric are Occupancy Networks'.
      What changes is the supervision: 2D images, cameras and masks, through
      an analytic depth gradient, instead of ground-truth 3D shapes.
  - node: srn2019
    type: fixes
    note: >
      Repairs the two costs DVR finds in SRN's LSTM-based renderer: "the
      geometry cannot be extracted directly and intermediate results need
      to be stored for computing gradients". DVR's surface is an occupancy
      level set that meshes directly, and implicit differentiation gives
      the depth gradient in closed form, so "no intermediate results need
      to be saved for the backward pass".
