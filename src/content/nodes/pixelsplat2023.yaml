title: "pixelSplat: 3D Gaussian Splats from Image Pairs for Scalable Generalizable 3D Reconstruction"
short: "pixelSplat (2023)"
authors: "David Charatan, Sizhe Lester Li, Andrea Tagliasacchi, Vincent Sitzmann"
venue: "CVPR 2024 (Oral, Best Paper Honorable Mention)"
year: 2023
branch: neural-rendering
lane: feedforward
links:
  arxiv: "https://arxiv.org/abs/2312.12337"
  code: "https://github.com/dcharatan/pixelsplat"
  project: "https://davidcharatan.com/pixelsplat/"
problem: >
  Generalizable view synthesis (the pixelNeRF line) predicts radiance fields
  feed-forward but renders them by volumetric sampling — so slow that
  training on real video at scale is impractical, and real-time use is out.
solution: >
  Predict 3D GAUSSIANS feed-forward from an image pair: an epipolar
  transformer resolves the scale ambiguity, and a probabilistic depth
  parameterization keeps gradients flowing despite the primitives' local
  support. Real-time rendering (about 650x faster than the next-fastest
  baseline), far less training memory, and an explicit, editable output.
limitations: >
  Two views in, and by its own account the per-view Gaussians are simply
  unioned rather than fused, unseen parts are not modeled generatively, and
  epipolar attention turns "prohibitively expensive" in memory with many
  views. As MVSplat showed, depth sampled from a learned distribution is
  also unreliable and parameter-heavy — the cost-volume repair (MVSplat) and
  LVSM's challenge to predicting 3D at all both arrived within the year.
relations:
  - node: 3dgs2023
    type: builds-on
    note: >
      Makes splatting feed-forward: 3DGS optimizes Gaussians per scene for
      30 minutes; pixelSplat amortizes that into a network that emits them
      in one pass — the representation crossing from optimization to
      prediction.
    i18n:
      ja:
        note: "スプラッティングをフィードフォワードにします。3DGS はシーンごとに30分かけてガウシアンを最適化しますが、pixelSplat はそれをネットワークに償却し、一度の forward で吐き出させる — 表現が最適化から予測へと渡る瞬間です。"
  - node: pixelnerf2020
    type: fixes
    note: >
      A cross-branch repair: keeps pixelNeRF's pixel-aligned, feed-forward
      recipe but swaps the implicit field for explicit Gaussians, fixing the
      cost pixelSplat names, citing pixelNeRF, as the line's key weakness —
      differentiable rendering "requires evaluating dozens or hundreds of
      points along each camera ray".
    i18n:
      ja:
        note: "枝をまたいだ直しです。pixelNeRF のピクセル整列・feed-forward のレシピを保ちつつ、陰的な場を明示的なガウシアンに置き換えました。直したのは、pixelSplat が pixelNeRF を引いてこの路線の最大の弱点と名指ししたコスト — 微分可能レンダリングは「カメラの光線ごとに数十から数百の点を評価する必要がある」ことです。"
status: seed
i18n:
  ja:
    problem: "汎化する視点合成 (pixelNeRF 路線) は放射輝度場をフィードフォワードで予測しますが、レンダリングは体積サンプリング — 実動画で大規模に学習するのが非現実的なほど遅く、リアルタイム利用は論外です。"
    solution: "画像ペアから3Dガウシアンを feed-forward で予測します。epipolar トランスフォーマーがスケールの曖昧性を解き、確率的な深度パラメータ化がプリミティブの局所的な台にもかかわらず勾配を流し続ける。リアルタイムレンダリング (次に速いベースラインの約650倍)、はるかに少ない学習時のメモリ、そして明示的で編集可能な出力です。"
    limitations: "入力は二視点です。本人たちの言うとおり、視点ごとのガウシアンは融合されずに和集合として出力されるだけで、見えない部分の生成的なモデリングも扱わず、視点を増やすと epipolar アテンションのメモリが「法外に高く」つきます。MVSplat が示したとおり、学習された分布からサンプルする深度は信頼性にも欠け、パラメータも重い — cost volume による直し (MVSplat) と、そもそも3Dを予測すること自体への LVSM の挑戦が、どちらも年内に到着しました。"
