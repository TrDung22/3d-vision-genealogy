title: "VGGT: Visual Geometry Grounded Transformer"
short: "VGGT (2025)"
authors: "Jianyuan Wang, Minghao Chen, Nikita Karaev, Andrea Vedaldi, Christian Rupprecht, David Novotny (Oxford VGG + Meta AI)"
venue: "CVPR 2025 (Oral, Best Paper Award)"
year: 2025
branch: single-image-3d
lane: scene
links:
  arxiv: "https://arxiv.org/abs/2503.11651"
  code: "https://github.com/facebookresearch/vggt"
problem: >
  Scene geometry was still a pipeline: SfM for cameras, MVS or per-scene
  optimization for dense geometry — slow, brittle, and structurally unable to
  run from a single image.
solution: >
  One feed-forward transformer that ingests 1 to hundreds of unposed images
  and directly outputs cameras, depth maps, point maps, and 3D point tracks in
  seconds — the DUSt3R line's bet on predicting geometry instead of
  optimizing it, taken to its logical end, and CVPR 2025's Best Paper.
limitations: >
  A head per task and quadratic attention over views; by its own account it
  fails under substantial non-rigid deformation, degrades under extreme input
  rotations, and does not support fisheye or panoramic images. Its own succession came fast: Depth Anything 3 showed
  a single plain transformer with one depth-ray target beats the multi-head
  design decisively.
relations:
  - node: pixelnerf2020
    type: fixes
    note: >
      Completes what conditioning began — though VGGT never cites pixelNeRF:
      pixelNeRF removed per-scene training but still needed posed inputs and,
      by its own account, rendered as slowly as NeRF; VGGT takes unposed
      images and predicts cameras and geometry directly, feed-forward, from
      one to hundreds of views.
    i18n:
      ja:
        note: "条件付けが始めたことを完成させます — ただし VGGT 自身は pixelNeRF を引用していません。pixelNeRF はシーンごとの学習を取り除いたものの、pose 付きの入力を必要とし、本人たちの言うとおりレンダリングは NeRF と同じく遅いままでした。VGGT は pose なしの画像から、カメラと幾何を、1枚から数百枚までの視点で feed-forward に直接予測します。"
status: seed
i18n:
  ja:
    problem: "シーンの幾何は依然としてパイプラインでした。カメラは SfM、密な幾何は MVS かシーンごとの最適化 — 遅く、脆く、そして構造上、一枚の画像からは走れません。"
    solution: "一つの feed-forward トランスフォーマーが、pose なしの画像を1枚から数百枚まで飲み込み、カメラ・深度マップ・点マップ・3Dポイントトラックを数秒で直接出力します — 幾何を最適化するのではなく予測するという DUSt3R 路線の賭けを論理的な果てまで進めた、CVPR 2025 のベストペーパーです。"
    limitations: "タスクごとに別ヘッド、視点数に対して二乗のアテンション。本人たちの言うとおり、大きな非剛体変形のある場面では破綻し、極端な入力の回転では再構成の性能が落ち、魚眼やパノラマの画像にも対応していません。後継はすぐに現れました — Depth Anything 3 が、素のトランスフォーマー + 単一の depth-ray ターゲットでマルチヘッド設計に決定的に勝てることを示したのです。"
