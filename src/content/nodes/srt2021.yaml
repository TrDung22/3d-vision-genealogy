title: "Scene Representation Transformer: Geometry-Free Novel View Synthesis Through Set-Latent Scene Representations"
short: "SRT (2021)"
authors: "Mehdi S. M. Sajjadi, Henning Meyer, Etienne Pot, Urs Bergmann, Klaus Greff, Noha Radwan, Suhani Vora, Mario Lučić, Daniel Duckworth, Alexey Dosovitskiy, Jakob Uszkoreit, Thomas Funkhouser, Andrea Tagliasacchi (Google Research)"
venue: "CVPR 2022"
year: 2021
branch: neural-rendering
lane: feedforward
links:
  arxiv: "https://arxiv.org/abs/2111.13152"
  project: "https://srt-paper.github.io/"
problem: >
  Render a never-seen scene from a few images, at interactive rates. NeRF
  trains per scene; re-projection methods like pixelNeRF need precise poses
  and still run their network hundreds of times per pixel; and latent
  models, usually geometry-free, "generally fail to scale to complex
  real-world datasets".
solution: >
  A transformer encoder turns patches from all input images, posed or not,
  into a SET of latent tokens — the scene representation — and a light-field
  decoder renders each pixel by letting its ray attend into that set: no
  volume, no projection, one feed-forward pass. It renders at 121 fps, has a
  pose-free variant (UpSRT), and scales to real Street View scenes.
limitations: >
  Blurry: by its own account renders blur even near the input views on
  complex scenes, the geometry-free model "will not work as well on very
  small datasets", and with close views and perfect poses pixelNeRF often
  still wins; its light field also carries no theoretical consistency
  guarantee. LVSM later found such geometry-free renderers "lack model
  capacity and scalability", and blamed SRT's CNN tokenizer and its
  cross-attention decoder.
relations:
  - node: gqn2018
    type: builds-on
    note: >
      Carries on the line SRT traces to GQN — methods that "learn to
      represent a scene with a latent vector from which novel views can be
      synthesized": encode the views, render any query with a learned
      decoder, no explicit geometry. What SRT changes is the latent, a set
      of tokens instead of one flat vector, "one of the main novelties of
      SRT"; collapsing it back to a flat latent costs 2.5 dB on
      MultiShapeNet.
  - node: pixelnerf2020
    type: fixes
    note: >
      Repairs two costs of pixelNeRF's re-projection that SRT measures:
      speed, which pixelNeRF itself concedes ("Like NeRF, our rendering time
      is slow"; 1.3 fps against SRT's 121), and the pose dependence SRT
      diagnoses in the whole line — "reliance on explicit camera projections
      requires precise camera poses". Under pose noise pixelNeRF "degrades
      sharply"; UpSRT runs on unposed images.
status: seed
