title: "TensoRF: Tensorial Radiance Fields"
short: "TensoRF (2022)"
authors: "Anpei Chen, Zexiang Xu, Andreas Geiger, Jingyi Yu, Hao Su"
venue: "ECCV 2022"
year: 2022
branch: neural-rendering
lane: efficiency
links:
  arxiv: "https://arxiv.org/abs/2203.09517"
  project: "https://apchenstu.github.io/TensoRF/"
problem: >
  The grid rebellion bought speed by paying in memory: a radiance voxel grid
  is a huge 4D tensor, most of which is redundant.
solution: >
  Factorize it: decompose the scene tensor into compact vector-matrix
  components (low-rank planes and lines). Quality above NeRF at minutes of
  training, in tens of MB where per-voxel grids need hundreds — the scene as
  a low-rank object.
limitations: >
  One bounding box only: by its own account it cannot handle unbounded
  scenes with background content, and its CP variant needs ever more
  components (and training time) as scenes get complex. Its lasting legacy
  is the factored plane itself, carried into dynamic fields by K-Planes,
  which credits both TensoRF and EG3D; generative 3D's triplane is a
  sibling, not an heir — EG3D published it three months earlier (TensoRF
  later read it as a special case of its VM factorization), and LRM took it
  from EG3D.
relations:
  - node: plenoxels2021
    type: fixes
    note: >
      Repairs the memory blowup of optimizing every voxel directly, which
      TensoRF diagnoses in Plenoxels ("huge model sizes"): keeps the fast
      direct-optimization recipe but factorizes the grid into low-rank
      vectors and matrices — 778 MB for Plenoxels vs 72 MB for TensoRF-VM
      (under 4 MB with CP) on Synthetic-NeRF.
  - node: eg3d2021
    type: independent
    note: >
      Two groups factored the 3D feature grid into axis-aligned planes three
      months apart, for different problems: EG3D to make a 3D GAN affordable,
      TensoRF to make per-scene radiance fields compact. TensoRF's first
      preprint never cites EG3D and its ECCV paper only lists it among
      generative NeRFs; a later revision files it under "Concurrent work",
      as "a special VM version that has constant vectors".
status: seed
