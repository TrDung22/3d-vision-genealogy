title: "DreamGaussian: Generative Gaussian Splatting for Efficient 3D Content Creation"
short: "DreamGaussian (2023)"
authors: "Jiaxiang Tang, Jiawei Ren, Hang Zhou, Ziwei Liu, Gang Zeng"
venue: "ICLR 2024 (Oral)"
year: 2023
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2309.16653"
  code: "https://github.com/dreamgaussian/dreamgaussian"
problem: >
  The SDS optimization loop of the Zero-1-to-3 era took tens of minutes to
  hours per object — because it was distilling into a NeRF, whose costly
  rendering the usual pruning speed-ups fail to accelerate under SDS.
solution: >
  Swap the canvas: run score distillation into 3D Gaussians instead of a NeRF.
  Progressive densification converges dramatically faster for generation, and
  a mesh-extraction + UV texture-refinement stage outputs a usable textured
  mesh in ~2 minutes — a ~10x speedup.
limitations: >
  Inherits the SDS line's familiar artifacts (Janus faces, over-saturated
  texture, baked lighting — problems the authors say it shares with previous
  works), and its image-to-3D back views can look blurry, they note.
  Gaussians make optimization fast, but by the authors' own comparison its
  mesh quality falls slightly behind slower optimization-based pipelines —
  the quality ceiling still belongs to them.
relations:
  - node: zero123-2023
    type: fixes
    note: >
      Repairs the weakness it names in Zero-1-to-3 — combined with SDS, it
      "still suffers from long optimization time" (~20 minutes per object in
      DreamGaussian's own comparison). Keeping Zero-1-to-3 (XL) as the 2D
      prior, it swaps the NeRF canvas for 3D Gaussian Splatting (the
      neural-rendering branch's 2023 breakthrough) and lands at ~2 minutes —
      an explicit cross-branch import.
    i18n:
      ja:
        note: "Zero-1-to-3 について自ら指摘した弱点 — SDS と組み合わせると「依然として最適化に長い時間がかかる」 (DreamGaussian 自身の比較で物体一つ約20分) — を直します。2D prior には Zero-1-to-3 (XL) を残したまま、NeRF のキャンバスを 3D Gaussian Splatting (ニューラルレンダリング枝の2023年のブレイクスルー) に替え、約2分に収めました — 明示的な枝またぎの輸入です。"
  - node: 3dgs2023
    type: builds-on
    note: >
      The imported canvas itself: 3DGS's fast differentiable rasterizer and
      progressive densification are what turn hours of NeRF-based score
      distillation into minutes.
    i18n:
      ja:
        note: "輸入されたキャンバスそのものです。3DGS の高速な微分可能ラスタライザと段階的な densification こそが、NeRF ベースの score distillation の数時間を数分に変えました。"
status: seed
i18n:
  ja:
    problem: "Zero-1-to-3 時代の SDS 最適化ループは、物体一つに数十分から数時間かかりました — 蒸留先が NeRF で、そのコストの高いレンダリングは、SDS のもとでは通常の枝刈りによる高速化も効かなかったからです。"
    solution: "キャンバスを替えます。score distillation の受け皿を NeRF から 3D Gaussian へ。段階的な densification により生成の収束は劇的に速くなり、メッシュ抽出 + UV テクスチャ精錬の段を経て、約2分で使えるテクスチャ付きメッシュが出てきます — およそ10倍の高速化です。"
    limitations: "SDS 路線おなじみのアーティファクト (Janus 顔、色の飽和したテクスチャ、焼き込まれた照明 — 著者ら自身が先行研究と共通の問題だと認めています) は相続したまま。画像からの3Dでは背面がぼやけることがある、とも著者らは記しています。Gaussian は最適化を速くする一方、著者ら自身の比較でもメッシュ品質は遅い最適化ベースのパイプラインにわずかに及ばず — 品質の天井は、今もそちらの側にあります。"
