title: "K-Planes: Explicit Radiance Fields in Space, Time, and Appearance"
short: "K-Planes (2023)"
authors: "Sara Fridovich-Keil, Giacomo Meanti, Frederik Rahbæk Warburg, Benjamin Recht, Angjoo Kanazawa"
venue: "CVPR 2023"
year: 2023
branch: dynamic-4d
lane: spacetime
links:
  arxiv: "https://arxiv.org/abs/2301.10241"
  paper: "https://openaccess.thecvf.com/content/CVPR2023/html/Fridovich-Keil_K-Planes_Explicit_Radiance_Fields_in_Space_Time_and_Appearance_CVPR_2023_paper.html"
  project: "https://sarafridov.github.io/K-Planes/"
  code: "https://github.com/sarafridov/K-Planes"
problem: >
  Dynamic radiance fields need a 4D volume, but "storing a 4D volume
  directly is prohibitively expensive due to the curse of dimensionality",
  and the factorizations that had made static fields compact "do not easily
  extend to higher dimensional volumes". The dynamic models leaned on MLPs
  instead, the fully implicit ones "completely black-box" and slow: DyNeRF
  trained a single scene on 8 GPUs for a week.
solution: >
  One plane for every pair of dimensions, "d-choose-2" in all: three for a
  static scene (a tri-plane), six for a video (xy, xz, yz plus the spacetime
  planes xt, yt, zt), with a per-image appearance code for photo
  collections. Plane features are multiplied rather than added, so that
  they can single out a point. Time planes start at 1, the multiplicative
  identity, and a sparsity prior keeps them there wherever nothing moves, so
  static and dynamic parts separate on their own. With a linear decoder over
  a learned color basis the model stays explicit, "white-box": a 4D volume
  that would need more than 300 GB fits in 200 MB, in pure PyTorch.
limitations: >
  By its own account it beats D-NeRF on D-NeRF's own scenes (31.61 vs 29.67
  dB, in 52 minutes rather than 48 hours) but not the very recent hybrids
  TiNeuVox and V4D. Later papers diagnosed what the planes leave out: in 4D
  Gaussian Splatting's comparison it renders below 1 fps at 800×800, and
  Dynamic 3D Gaussians noted that such Eulerian grids "do not give rise to
  correspondence over time". The planes record what is where, not where
  each thing went.
relations:
  - node: hexplane2023
    type: independent
    note: >
      One day apart in January 2023, two groups factored spacetime into the
      same six feature planes, one per pair of x, y, z, t, and combined them
      by multiplication; K-Planes even calls its 4D model "hex-planes".
      K-Planes never cites HexPlane, and HexPlane's camera-ready names
      K-Planes in its paragraph on concurrent work as "most closely related".
      They differ in fusion and reach: HexPlane multiplies each space plane
      with its spacetime partner and concatenates the three products,
      K-Planes multiplies all six and generalizes to any dimension.
  - node: eg3d2021
    type: builds-on
    note: >
      Generalizes EG3D's tri-plane from a 3D GAN's feature volume to any
      number of dimensions: in 3D, K-Planes says, its model "reduces to the
      tri-plane factorization", similar to EG3D's "except that the elements
      are multiplied". That switch from adding to multiplying is its own: a
      product can localize a point where a sum only draws intersecting
      lines, and with K-Planes' linear decoder it is worth 35.29 vs 28.78 dB
      on Lego.
  - node: tensorf2022
    type: builds-on
    note: >
      Carries TensoRF's lesson, that a radiance field factorizes into
      compact low-rank factors, from static scenes into time and appearance.
      Among its inspirations K-Planes singles out "the tensor decomposition"
      of TensoRF, next to EG3D's tri-plane; and TensoRF, which "offers both
      hybrid and explicit versions" as K-Planes does, is the static
      yardstick it measures itself against.
  - node: plenoxels2021
    type: fixes
    note: >
      Repairs the scaling of Plenoxels' voxel grid, which K-Planes, from the
      same group, diagnoses: it "grows exponentially with dimension, making
      it challenging to scale to high resolution and completely intractable
      for 4D dynamic volumes". K-Planes keeps the explicit modeling it
      credits to Plenoxels and swaps the grid for planes: about 33M
      parameters against Plenoxels' ~500M on the synthetic scenes, and 4D
      within reach.
status: seed
