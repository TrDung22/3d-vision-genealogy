title: "Volume Rendering of Neural Implicit Surfaces"
short: "VolSDF (2021)"
authors: "Lior Yariv, Jiatao Gu, Yoni Kasten, Yaron Lipman (Weizmann & Facebook AI)"
venue: "NeurIPS 2021 (Oral)"
year: 2021
branch: neural-rendering
lane: surfaces
links:
  arxiv: "https://arxiv.org/abs/2106.12052"
  project: "https://lioryariv.github.io/volsdf/"
problem: >
  The same disease NeuS diagnosed the same month: NeRF's density is a
  rendering device, not a geometry — and surface rendering (IDR) needs
  object masks and tends to grow extraneous surface parts.
solution: >
  Model density as a transformed signed distance function (Laplace CDF of
  the SDF), giving the learned geometry a useful inductive bias plus an
  error-bounded sampling algorithm — clean surfaces from volume rendering,
  with a disentangled geometry/appearance split.
limitations: >
  Same per-scene cost and smoothness ceiling as NeuS; the two papers'
  density constructions differ enough that later work kept benchmarking
  them side by side.
relations:
  - node: neus2021
    type: independent
    note: >
      arXiv two days apart (June 20 and 22, 2021), both at NeurIPS 2021:
      Hong Kong/MPI and Weizmann/Facebook independently rederived an
      SDF-induced density with different math — the 2019 implicit wave's
      sequel, played out in volume rendering.
  - node: unisurf2021
    type: independent
    note: >
      Two months apart on arXiv (April 20 and June 22, 2021), Tübingen and
      Weizmann/Facebook put an implicit surface inside volume rendering;
      VolSDF says UNISURF did so "concurrently with our work here", with an
      "implicit surface representation incorporated into volume rendering".
      Same discovery, different bridge: occupancy as the local transparency
      there, a Laplace CDF of the SDF here.
  - node: nerf2020
    type: fixes
    note: >
      Repairs the geometry NeRF leaves implicit in its density. VolSDF's
      diagnosis: "it is non-trivial to find a proper threshold to extract
      surfaces from the predicted density, and the recovered geometry is far
      from satisfactory". Making density a function of an SDF guarantees a
      well-defined surface behind it, while keeping NeRF's mask-free volume
      rendering.
  - node: idr2020
    type: fixes
    note: >
      The first author's own surface renderer, repaired (Yariv, Kasten and
      Lipman are on both papers). VolSDF names IDR's "two drawbacks": "it
      requires object masks for training, which is a strong supervision
      signal", and setting each pixel's color from "the single point of
      intersection of the corresponding viewing ray" invites local minima
      that sometimes show up as extraneous surface parts. Volume rendering an
      SDF-derived density answers both while keeping IDR's normal-aware
      radiance field; on DTU, without masks, VolSDF is "on par with IDR"
      (mean Chamfer 0.86 against 0.90).
status: seed
