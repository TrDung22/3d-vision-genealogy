title: "Shape from Shading: A Method for Obtaining the Shape of a Smooth Opaque Object from One View"
short: "Shape from Shading (Horn 1970)"
authors: "Berthold K. P. Horn"
venue: "PhD thesis, MIT, 1970"
year: 1970
branch: single-image-3d
lane: priors
problem: >
  Inferring 3D surface shape from ONE image — the founding formulation of
  shape from shading in computer vision, and an early statement of the
  ill-posed problem: infinitely many different surfaces can produce the same
  observed image.
solution: >
  No learning from data; instead, model the physics of image formation: assume
  the surface's reflectance function and the light-source position are known,
  then invert the shading equation with the method of characteristic strips.
limitations: >
  The physical assumptions (reflectance, illumination, smooth surfaces) almost
  never hold for natural images. Once statistical learning and then deep
  learning took over single-image 3D, the physics-prior line lived on mostly
  at the margins (SIRFS extended it in 2012) — a classic "orphaned branch".
relations: []
status: seed
i18n:
  ja:
    problem: "一枚の画像から3D表面の形状を推定する — コンピュータビジョンにおける shape from shading の出発点となった定式化であり、ill-posed な問題をいち早く言い表したものでもあります。まったく異なる無数の表面が、同じ一枚の画像を生み出しうるのです。"
    solution: "データからの学習は一切なし。代わりに画像生成の物理をモデル化します。表面の反射関数と光源の位置が既知だと仮定し、特性帯 (characteristic strips) の方法でシェーディング方程式を逆向きに解くのです。"
    limitations: "物理の仮定 (反射特性、照明、滑らかな表面) は、自然画像ではほぼ成り立ちません。統計的学習、そして深層学習が単一画像3Dの主役になると、この物理 prior の路線は主に傍流で生き延びることになりました (2012年に SIRFS が拡張) — 典型的な「孤児の枝」です。"
