title: "Text-To-4D Dynamic Scene Generation"
short: "MAV3D (2023)"
authors: "Uriel Singer, Shelly Sheynin, Adam Polyak, Oron Ashual, Iurii Makarov, Filippos Kokkinos, Naman Goyal, Andrea Vedaldi, Devi Parikh, Justin Johnson, Yaniv Taigman (Meta AI)"
venue: "ICML 2023"
year: 2023
branch: dynamic-4d
lane: generation
links:
  arxiv: "https://arxiv.org/abs/2301.11280"
  paper: "https://proceedings.mlr.press/v202/singer23a.html"
  project: "https://make-a-video3d.github.io/"
problem: >
  Text could already become an image, a video, or a static 3D object
  (DreamFusion), but "these two categories of generative models have been
  studied in isolation to date". A moving 3D scene from text has nothing to
  learn from: "there is no readily available collection of 4D models, with
  or without textual annotations".
solution: >
  Use a text-to-video model as "a ‘statistical’ multi-camera setup": render
  a dynamic NeRF, a HexPlane, from moving virtual cameras and let Meta's
  Make-A-Video score the clips through a temporal score distillation
  (SDS-T). It has to go in stages: a static scene first, fitted with a
  text-to-image model on the three spatial planes alone, then the three
  time planes switched on for the video model, then super-resolution
  fine-tuning. No 3D or 4D data at all; the first text-to-4D results, at
  83.7% CLIP R-Precision against 6-11% for reconstructing Make-A-Video
  clips frame by frame or with D-NeRF.
limitations: >
  By its own account it is "bounded by" Make-A-Video's performance, its
  view-dependent prompts only mitigate the multi-face problem, and it
  reaches real time only by converting to "a sequence of disjoint meshes",
  inefficient where predicted vertex trajectories would do. Each prompt
  costs about 6.5 hours on 8 A100 GPUs, and, as 4D-fy noted, its video
  teacher was proprietary. 4D-fy later found that "MAV3D noticeably lacks
  detail", though its raters judged MAV3D's motion roughly on par with
  4D-fy's.
relations:
  - node: hexplane2023
    type: builds-on
    note: >
      Its 4D scene is a HexPlane, adopted three days after HexPlane was
      posted, with HexPlane's co-author Justin Johnson on the paper: "We thus
      adopt HexPlane (Cao & Johnson, 2023), a recently proposed
      representation for dynamic scenes". The planes' split into space and
      spacetime becomes the training curriculum: spatial planes alone for the
      static stage, time planes switched on for the video stage. The motion
      comes from the video model; swapping in D-NeRF barely matters (81.9 vs
      83.7 R-Precision), MAV3D being "not sensitive to the dynamic backbone".
status: seed
