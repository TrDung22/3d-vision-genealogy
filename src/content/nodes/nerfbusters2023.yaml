title: "Nerfbusters: Removing Ghostly Artifacts from Casually Captured NeRFs"
short: "Nerfbusters (2023)"
authors: "Frederik Warburg*, Ethan Weber*, Matthew Tancik, Aleksander Holynski, Angjoo Kanazawa (UC Berkeley, Google Research)"
venue: "ICCV 2023"
year: 2023
branch: neural-rendering
lane: radiance-fields
links:
  arxiv: "https://arxiv.org/abs/2304.10532"
  paper: "https://openaccess.thecvf.com/content/ICCV2023/html/Warburg_Nerfbusters_Removing_Ghostly_Artifacts_from_Casually_Captured_NeRFs_ICCV_2023_paper.html"
  project: "https://ethanweber.me/nerfbusters/"
  code: "https://github.com/ethanweber/nerfbusters"
problem: >
  Casually captured NeRFs look great on the benchmark and fall apart a few
  steps off the capture path — floaters, ghostly geometry. Why did the
  numbers never show it?
solution: >
  Two moves. An evaluation fix first: the standard protocol only assesses
  "every 8th frame of the training capture", so test views share the
  training trajectory; Nerfbusters records two trajectories per scene (12
  scenes), trains on one and evaluates on the other, with visibility-masked
  metrics plus a coverage score. Then a method: a local 3D diffusion prior
  over density, applied through a density score-distillation loss, removes
  floaters that hand-crafted regularizers (sparsity, TV, RegNeRF) leave in
  place.
limitations: >
  The prior acts on density alone: it deletes floaters — and, wrongly,
  transparent objects — but cannot hallucinate texture or inpaint regions no
  training view saw; the authors point to 2D diffusion priors as the route
  ahead. The cleaner scenes also come at lower coverage than the baselines.
relations:
  - node: nerf2020
    type: challenges
    note: >
      Questions the evaluation protocol NeRF carried forward from LLFF: holding
      out every 8th frame of the same capture means train and test views share
      one camera path, so whatever breaks off that path never reaches the
      scores. Training on one trajectory and testing on another makes the
      ghosts visible.
  - node: dycheck2022
    type: builds-on
    note: >
      Carries DyCheck's reality check from dynamic scenes to static ones: it
      cites Gao et al.'s re-examination of dynamic-NeRF evaluation and adopts
      its visibility masking (computed its own way, with depth) for a
      second-trajectory protocol.
status: seed
