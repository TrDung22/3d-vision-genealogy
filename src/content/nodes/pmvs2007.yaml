i18n:
  ja:
    problem: "2007年の多視点ステレオは、ほとんどが変分法でした。明示的な滑らかさの制約のもとで、全体の測光的な食い違いを最小にする表面を探すのです。周りをぐるりと撮影したコンパクトな物体ならそれでうまくいきますが、最適化を始める前に「境界ボリューム (有効な深度範囲、バウンディングボックス、visual hull)」をたいてい決めておかなければなりません — 屋外のシーンや散らかった画像ではそれができず、建物の前を人が行き交うシーンならなおさらです。"
    solution: "表面を変形させるのではなく、パッチ一枚ずつ育てていきます。Harris と Difference-of-Gaussians の特徴をエピポーラ線に沿って視点間で対応付け、小さな向き付きの矩形パッチの疎な集合をつくります。各パッチの中心と法線は、そのパッチが見える画像どうしの平均 NCC スコアを最大化して詰めます。続いて「拡張」(空いている隣の画像セルへパッチを広げる) と「フィルタ」(可視性に反するパッチを捨てる) を3回繰り返し、種を準密な surfel の雲へと育てます — 境界ボリュームは要らず、近くの特徴どうしを平滑化することもなく、外れ値や動く障害物は途中で自動的に捨てられます。Middlebury の6つのデータセットのうち4つで精度と網羅性の首位に立ち、ソフトウェアのページは、公開されたコード (PMVS2) を実制作に使う組織として ILM、Weta Digital、Google を挙げています。"
    limitations: "本人たちの言うとおり、パッチが表面を覆うのは「小さなテクスチャのない領域や隠れた領域を除いて」であり、速度と引き換えに精度を取りました。拡張の段だけで、データセットごとに約20分から数時間かかります。ジャーナル版はさらにこう付け加えています。強い正則化を欠くため、点を復元できるのは信頼できるテクスチャのある場所だけで、穴埋めは後処理に任され、しかも一定の照明のもとでのランバート面を仮定しています。のちに MVSNet は、この伝播そのものを診断しました。逐次的に進むため、こうした手法は「完全な並列化が難しく、処理に長い時間がかかりがち」であり、手作りの MVS の例に漏れず、網羅性には「大きな改善の余地」が残る、と。"
