title: "Accurate, Dense, and Robust Multi-View Stereopsis"
short: "PMVS (2007)"
authors: "Yasutaka Furukawa, Jean Ponce (UIUC + ENS Paris)"
venue: "CVPR 2007 (journal version: TPAMI 2010)"
year: 2007
branch: multi-view-geometry
lane: mvs
links:
  paper: "https://ieeexplore.ieee.org/document/4270271"
  journal: "https://ieeexplore.ieee.org/document/5226635"
  code: "https://www.di.ens.fr/pmvs/"
problem: >
  Multi-view stereo in 2007 was mostly variational: find the surface that
  minimizes a global photometric discrepancy under explicit smoothness
  constraints. That worked for compact objects photographed from all
  around, but it "typically requires determining a bounding volume (valid
  depth range, bounding box, or visual hull)" before the optimization can
  start — not feasible for outdoor scenes or cluttered images, let alone
  crowds walking in front of a building.
solution: >
  Grow the surface patch by patch instead of evolving it. Harris and
  Difference-of-Gaussians features are matched across views along epipolar
  lines into a sparse set of small oriented rectangles, each patch's centre
  and normal refined by maximizing its average NCC score over the images
  that see it. Three rounds of expand (spread patches into empty
  neighbouring image cells) and filter (drop patches that break visibility)
  then grow the seeds into a quasi-dense surfel cloud — no bounding volume,
  no smoothing across nearby features, outliers and moving obstacles
  discarded on the way. It led accuracy and completeness on four of the six
  Middlebury datasets, and its software page lists ILM, Weta Digital and
  Google among production users of the released code (PMVS2).
limitations: >
  By its own account the patches cover the surfaces "except in small
  textureless or occluded regions", and it traded speed for accuracy: the
  expansion step alone took from about 20 minutes to a few hours per
  dataset. The journal version adds that, lacking strong regularization, it
  reconstructs points only where texture is reliable, leaves holes for
  post-processing, and assumes Lambertian surfaces under constant light.
  MVSNet later diagnosed the propagation itself: proceeding sequentially,
  such methods are "difficult to be fully parallelized and usually take a
  long time in processing" — and like the rest of hand-crafted MVS they
  leave completeness with "large room for improvement".
