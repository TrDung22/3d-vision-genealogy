title: "TripoSR: Fast 3D Object Reconstruction from a Single Image"
short: "TripoSR (2024)"
authors: "Dmitry Tochilkin, David Pankratz, Zexiang Liu, Zixuan Huang, Adam Letts, Yangguang Li, Ding Liang, Christian Laforte, Varun Jampani, Yan-Pei Cao"
venue: "arXiv 2024"
year: 2024
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2403.02151"
  code: "https://github.com/VAST-AI-Research/TripoSR"
problem: >
  LRM proved feed-forward 3D works but shipped closed-source — the community
  needed an open, fast version that runs on commodity hardware.
solution: >
  Reproduce and streamline the LRM recipe: better Objaverse data curation and
  training/rendering details, open weights + code, objects reconstructed in
  under 0.5 seconds.
limitations: >
  As InstantMesh and TripoSG later diagnosed, a deterministic single-image
  regressor lacks imagination for unseen sides: back-side geometry and texture
  degrade on free-style inputs, with artifacts in occluded areas. Its
  historical role, though, is DEMOCRATIZING the feed-forward line.
relations:
  - node: lrm2023
    type: builds-on
    note: >
      Inherits the LRM architecture and, released under the MIT license,
      offers a stronger open model than the OpenLRM reimplementation it
      benchmarks against — opening the way for the community to climb onto
      this line's shoulders.
    i18n:
      ja:
        note: "LRM のアーキテクチャを受け継ぎ、MIT ライセンスで公開することで、比較対象とした再実装 OpenLRM よりも強いオープンなモデルを提供しました — コミュニティがこの路線の肩に乗れる道を開いたのです。"
  - node: objaverse2023
    type: builds-on
    note: >
      Trained exclusively on Objaverse: its data improvements are "a
      carefully curated subset of the Objaverse dataset" and renderings closer
      to real-world images.
    i18n:
      ja:
        note: "学習データは Objaverse だけです。データ面の改良は「Objaverse データセットから丁寧に選び抜いたサブセット」と、実写の画像分布に近づけたレンダリングでした。"
status: seed
i18n:
  ja:
    problem: "LRM はフィードフォワード3Dが成り立つことを証明しましたが、クローズドソースのまま — コミュニティに必要だったのは、普通のハードウェアで動く、開かれた高速版です。"
    solution: "LRM のレシピを再現し、磨き上げます。Objaverse データのキュレーションと学習・レンダリングの細部を改善し、重みとコードを公開。物体の再構成は0.5秒を切ります。"
    limitations: "後に InstantMesh と TripoSG が診断したとおり、決定的な単一画像の回帰器は見えない側を想像できません。自由なスタイルの入力では背面の幾何とテクスチャが劣化し、遮蔽領域にはアーティファクトが出ます。それでも歴史的な役割は、フィードフォワード路線の民主化にあります。"
