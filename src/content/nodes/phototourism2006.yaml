title: "Photo Tourism: Exploring Photo Collections in 3D"
short: "Photo Tourism (2006)"
authors: "Noah Snavely, Steven M. Seitz, Richard Szeliski (University of Washington + Microsoft Research)"
venue: "SIGGRAPH 2006"
year: 2006
branch: multi-view-geometry
lane: sfm
links:
  project: "https://phototour.cs.washington.edu/"
  paper: "https://phototour.cs.washington.edu/Photo_Tourism.pdf"
  code: "https://www.cs.cornell.edu/~snavely/bundler/"
problem: >
  Make sense of the photographs the Internet already holds: thousands of
  shots of the same landmark, from "hundreds of different cameras, zoom
  levels, resolutions", across seasons and weather, with no GPS and EXIF
  focal lengths that are "sometimes inaccurate". Two earlier systems for the
  same SfM problem, Brown and Lowe's and Schaffalitzky and Zisserman's, had
  been tested only on "much simpler datasets with more limited variation in
  imaging conditions"; recovering every photo's viewpoint from such a crowd
  was what a 3D photo browser needed first.
solution: >
  A robust incremental SfM pipeline as the front end of a photo explorer.
  SIFT keypoints are matched between every pair of images; RANSAC around
  the eight-point algorithm keeps only matches consistent with a fundamental
  matrix; the survivors are chained into tracks. Reconstruction starts from
  the pair with the most matches that a single homography cannot explain,
  then adds cameras incrementally — initialized by DLT and EXIF focal
  lengths — re-running bundle adjustment and discarding outlier tracks as
  the model grows. The cameras and sparse points then drive the browser:
  transitions between photos, object-based browsing, annotation transfer.
  By its own account, "the first successful demonstration of SfM techniques
  being applied to the kinds of real-world image sets found on Google and
  Flickr".
limitations: >
  By its own account the SfM "becomes slow as the number of registered
  cameras grows": from a few hours for Great Wall (82 photos registered) to
  about two weeks for Notre Dame (597 registered of 2,635), mostly in bundle
  adjustment. Its camera model "does not handle lens distortion", scenes
  with repeating structures or without strong features are "challenging to
  reconstruct automatically", and only one connected component is
  reconstructed. The SfM lived on as Bundler (released 2008), the baseline
  whose track triangulation COLMAP later found "not robust to outliers" and
  costly "due to exhaustive pairwise triangulation".
relations:
  - node: sift1999
    type: builds-on
    note: >
      Stands on SIFT for every correspondence it finds: "We use the SIFT
      keypoint detector [Lowe 2004], because of its invariance to image
      transformations" (citing SIFT's 2004 journal paper) — several thousand
      keypoints per image, their descriptors matched across every image pair,
      for collections spanning "hundreds of different cameras, zoom levels,
      resolutions". The tracks, and so the reconstruction, are built from
      those matches.
  - node: hartley1995
    type: builds-on
    note: >
      Every image pair is verified with two-view geometry: "During each RANSAC
      iteration, we compute a candidate fundamental matrix using the
      eight-point algorithm" — cited through Hartley & Zisserman's textbook,
      whose algorithm for F is the normalized one this node introduced.
      Matches that disagree with that fundamental matrix are discarded before
      any track is built.
