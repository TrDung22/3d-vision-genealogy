title: "3D-R2N2: A Unified Approach for Single and Multi-view 3D Object Reconstruction"
short: "3D-R2N2 (2016)"
authors: "Christopher B. Choy, Danfei Xu, JunYoung Gwak, Kevin Chen, Silvio Savarese"
venue: "ECCV 2016"
year: 2016
branch: single-image-3d
lane: object
links:
  arxiv: "https://arxiv.org/abs/1604.00449"
  code: "https://github.com/chrischoy/3D-R2N2"
problem: >
  A depth map is only 2.5D — the visible surface. Recover the FULL 3D shape of
  an object, occluded parts included, from one (or a few) images.
solution: >
  A recurrent network (3D-LSTM) mapping images to a voxel occupancy grid,
  trained with supervision on ShapeNet CAD models. Shape priors learned from
  CAD repositories were an older idea; what R2N2 claims as a first is learning
  the whole image-to-shape mapping end to end with a deep network — the
  baseline the deep object-reconstruction line then measured itself against.
limitations: >
  Voxels cost O(n³) memory, so it was stuck at 32³ — lego-brick models. And its
  knowledge came almost entirely from ShapeNet: a closed world of some 50,000
  CAD models in 13 categories.
relations:
  - node: eigen2014
    type: builds-on
    note: >
      Inherits the belief that a 3D prior can be learned from data with a deep
      network — R2N2 cites Eigen et al. among the "recent progress in
      single-view 3D reconstruction using Convolutional Neural Networks" that
      inspired it — but changes the target from the visible surface (2.5D) to
      the full shape.
    i18n:
      ja:
        note: "3Dの prior はデータから深層ネットワークで学べる、という信念を受け継ぎます — R2N2 は着想源として、Eigen らを「畳み込みニューラルネットワークによる単一視点3D再構成の最近の進歩」の一つに挙げています。ただし目標は、見えている表面 (2.5D) から形状の全体へと切り替えました。"
  - node: shapenet2015
    type: builds-on
    note: >
      Learning a full-3D shape prior with 3D supervision needs a warehouse of
      labeled shapes, and ShapeNet was it: R2N2 trained on a 50,000-model,
      13-category subset — the split Pixel2Mesh and Occupancy Networks later
      inherited.
    i18n:
      ja:
        note: "3Dの教師信号で完全な3D形状の prior を学ぶには、ラベル付き形状の倉庫が要ります。それが ShapeNet でした。R2N2 は13カテゴリ・5万モデルのサブセットで学習し、その分割は後に Pixel2Mesh や Occupancy Networks が受け継ぐ標準になります。"
status: seed
i18n:
  ja:
    problem: "深度マップはあくまで2.5D — 見えている表面にすぎません。ここでの問題は、一枚 (または数枚) の画像から、遮蔽された部分も含む物体の完全な3D形状を復元することです。"
    solution: "画像をボクセル占有グリッドへ写す再帰型ネットワーク (3D-LSTM) を、ShapeNet の CAD モデルで教師あり学習します。CAD リポジトリから形状の prior を学ぶこと自体は古いアイデアでした。R2N2 が初の試みと主張するのは、画像から形状への写像全体を深層ネットワークで end-to-end に学んだ点です — その後の深層物体再構成の路線が、こぞって比較の基準にしたベースラインになりました。"
    limitations: "ボクセルはメモリを O(n³) で食うため 32³ で頭打ち — レゴブロックのようなモデルしか出せません。しかも知識のほぼすべては ShapeNet 由来。13カテゴリ・約5万個の CAD モデルという閉じた世界です。"
