title: "In Defense of the Eight-Point Algorithm"
short: "Normalized 8-Point (Hartley 1995)"
authors: "Richard I. Hartley (GE Corporate Research and Development)"
venue: "TPAMI 1997 (conference version: ICCV 1995)"
year: 1995
branch: multi-view-geometry
lane: two-view
links:
  paper: "https://users.cecs.anu.edu.au/~hartley/Papers/fundamental/ICCV-final/fundamental.pdf"
  journal: "https://doi.org/10.1109/34.601246"
problem: >
  The eight-point algorithm was "a frequently cited method" for the
  fundamental matrix of two uncalibrated views — linear, fast, simple — and
  the field's verdict on it was harsh: "extremely susceptible to noise and
  hence virtually useless for most purposes". The many alternatives
  proposed in its place were all "considerably more complicated".
solution: >
  Blame the coordinates, not the algorithm. In raw pixel coordinates the
  linear system is badly conditioned, and the cause, Hartley shows, is "the
  lack of homogeneity in the image coordinates". So before solving, each
  image's points are translated to put their centroid at the origin and
  scaled to an average distance of √2 from it; F is computed for the
  normalized points, its rank-2 constraint enforced, and the transformation
  undone. On real images the normalized eight-point algorithm performs
  "almost as well as the best iterative algorithms", runs "about 20 times
  faster" and is "far easier to code".
limitations: >
  By its own account the normalization gets "only an intuitive
  justification", since "a complete analysis of the condition number of the
  matrix is too complex to undertake here", and the algorithm comes close to
  the best iterative methods without claiming to match them. It also needs
  clean matches: in its tests "outliers were detected and removed"
  beforehand. Robustness was left to a wrapper — a decade later, Photo
  Tourism runs the eight-point algorithm inside RANSAC, computing "a
  candidate fundamental matrix" in each iteration. Evaluation "in the
  calibrated case", Longuet-Higgins's own setting, it left as "a project for
  possible future work".
relations:
  - node: longuethiggins1981
    type: fixes
    note: >
      Repairs the weakness the eight-point algorithm had acquired once it was
      carried over to uncalibrated cameras and raw pixel coordinates: it "has
      often been criticized for being excessively sensitive to noise in the
      specification of the matched points". Hartley traces the fault to
      conditioning, "the lack of homogeneity in the image coordinates", and
      removes it by translating each image's points to their centroid and
      scaling them to an average distance of √2 before solving. Without that
      step the algorithm "performs quite badly, often with errors as large as
      10 pixels"; with it, almost as well as the best iterative methods, at
      about 20 times their speed.
    i18n:
      ja:
        note: "8点アルゴリズムが、校正なしのカメラと生のピクセル座標へ持ち込まれて以来まとわりついていた弱点を直します。それは「対応点の指定に含まれるノイズに過度に敏感だと、たびたび批判されてきた」のです。Hartley はその原因を方程式の条件の悪さ — 「画像座標の不均質さ」 — に突き止め、解く前に各画像の点を重心へ平行移動し、平均距離 √2 にスケーリングすることで取り除きました。この一手間がなければ、アルゴリズムは「かなりひどい性能で、しばしば10ピクセルもの誤差」を出します。あれば最良の反復手法にほぼ並び、しかも約20倍速いのです。"
status: seed
i18n:
  ja:
    problem: "8点アルゴリズムは、校正されていない2視点の基礎行列 (fundamental matrix) を求める「よく引用される方法」でした — 線形で、速く、単純です。ところが分野の評価は辛辣でした。「ノイズにきわめて弱く、したがってほとんどの用途で事実上役に立たない」。代わりに提案された数々の手法は、どれも「はるかに複雑」なものでした。"
    solution: "悪いのはアルゴリズムではなく座標だ、と見抜きます。生のピクセル座標のままでは連立一次方程式の条件が悪く、その原因は「画像座標の不均質さ」にあると Hartley は示しました。そこで解く前に、各画像の点を重心が原点に来るよう平行移動し、原点からの平均距離が √2 になるようスケーリングします。正規化した点で F を求め、ランク2の制約を課してから、変換を元に戻す。実画像での正規化8点アルゴリズムは「最良の反復アルゴリズムとほぼ同等」に働き、「約20倍速く」、しかも「はるかに実装しやすい」のです。"
    limitations: "本人の言うとおり、正規化には「直観的な正当化」しか与えられていません。「行列の条件数の完全な解析は、ここで扱うには複雑すぎる」からです。最良の反復手法に迫りはしても、並ぶとは主張しません。きれいな対応点も前提で、実験では「外れ値を検出して取り除いて」から評価していました。頑健さは外側の枠組みに委ねられます — 10年後の Photo Tourism は8点アルゴリズムを RANSAC の中で回し、反復ごとに「基礎行列の候補」を計算します。Longuet-Higgins 本来の設定である「校正済みの場合」の評価は、「今後の課題」として残されました。"
