title: "CLAY: A Controllable Large-scale Generative Model for Creating High-quality 3D Assets"
short: "CLAY (2024)"
authors: "Longwen Zhang, Ziyu Wang, Qixuan Zhang, Qiwei Qiu, Anqi Pang, Haoran Jiang, Wei Yang, Lan Xu, Jingyi Yu (ShanghaiTech, Deemos, HUST)"
venue: "SIGGRAPH 2024 (Best Paper Honorable Mention)"
year: 2024
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2406.13897"
problem: >
  Early 3D diffusion (Point-E, Shap-E) proved you could generate 3D natively,
  but geometry stayed coarse and never reached production quality or fine user
  control. Could native 3D generation reach the fidelity and steerability that
  made 2D diffusion a phenomenon?
solution: >
  Scale the 3D latent, not a distillation. CLAY compresses shapes into a neural
  latent set (the 3DShape2VecSet lineage) and trains a large diffusion
  transformer (DiT) over it — geometry FIRST, then a separate material stage —
  pushing to 1.5B parameters on a carefully assembled asset pool. The result is
  clean, watertight geometry with multi-modal control (text, image, voxel,
  point cloud) at a fidelity earlier 3D diffusion couldn't touch.
limitations: >
  Geometry-first means a multi-stage pipeline — shape, then remeshing and UV
  unwrapping, then PBR materials — which the authors admit is "not yet
  complete end-to-end"; and its latent encodes shape alone, decoding to a
  single occupancy field. The unresolved wish: one STRUCTURED latent that
  carries geometry and appearance together and decodes to whichever
  representation you need, in a single generation (→ TRELLIS).
relations:
  - node: pointe-shape2022
    type: fixes
    note: >
      Repairs the weakness it diagnoses in the 3D-native line Point-E and
      Shap-E belong to: such models "have not sufficiently explored rich
      geometric features embedded in the datasets", and "their small model
      size limits the capability of generalization and diversification".
      Keeping the bet — diffusion straight on a 3D representation — it mines
      the data with tailored geometry processing and scales a latent-set DiT
      to 1.5B parameters, turning native 3D generation from a proof of concept
      into production-grade geometry.
    i18n:
      ja:
        note: "Point-E と Shap-E が属する 3D native 路線に CLAY が見出した弱点を直します。こうしたモデルは「データセットに埋め込まれた豊かな幾何的特徴を十分に掘り下げておらず」、しかも「モデルサイズの小ささが汎化と多様化の能力を制限している」。3D表現の上で直接 diffusion するという賭けはそのままに、作り込んだ幾何処理でデータを掘り起こし、latent-set の DiT を15億パラメータまでスケールして、native 3D generation を概念実証から production 級の幾何へと引き上げました。"
  - node: objaverse2023
    type: builds-on
    note: >
      Its data trunk: geometry is learned from 527K objects refined from
      ShapeNet and Objaverse, and its material diffusion from over 40,000
      Objaverse objects chosen for high-quality PBR materials.
    i18n:
      ja:
        note: "データの幹です。幾何は ShapeNet と Objaverse から精製した52.7万物体で、マテリアルの拡散モデルは高品質な PBR マテリアルを持つ4万以上の Objaverse 物体で学習します。"
  - node: shape2vecset2023
    type: builds-on
    note: >
      Its latent is 3DShape2VecSet's, scaled up: "We adopt the representation
      and architecture from 3DShape2VecSet but augment it with new scaling-up
      strategies." The augmentation answers the gap CLAY names — "In
      3DShape2VecSet, the point clouds are generally of small sizes and
      therefore are insufficient to capture fine geometric details" — with a
      multi-resolution VAE (2,048 to 8,192 input points, the latent length
      growing with them) beneath a 1.5B-parameter DiT.
    i18n:
      ja:
        note: "latent は 3DShape2VecSet のものを、スケールさせて使います。「3DShape2VecSet の表現とアーキテクチャを採用し、新たなスケールアップの戦略で補強する」。補強が応えるのは CLAY 自身が名指しした隙間 — 「3DShape2VecSet では点群が総じて小さく、細かな幾何ディテールを捉えるには不十分」— で、入力を2,048〜8,192点で切り替え、latent の長さもそれに応じて伸びる多解像度 VAE を、15億パラメータの DiT の下に据えました。"
status: seed
i18n:
  ja:
    problem: "初期の 3D diffusion (Point-E、Shap-E) は3Dを native に生成できることを示しましたが、幾何は粗いままで、production 品質にも細かなユーザー制御にもスケールしませんでした。native 3D generation は、2D diffusion を現象にした忠実度と操作性に届くのか?"
    solution: "蒸留ではなく、3D latent 自体をスケールします。CLAY は形状をニューラルな latent set (3DShape2VecSet 系) に圧縮し、その上で大きな diffusion transformer (DiT) を学習 — 幾何を先に、次に別段のマテリアル生成 — 丁寧に集めたアセット群の上で15億パラメータまで押し上げます。結果は、清潔で水密な幾何と、多様な入力 (テキスト、画像、ボクセル、点群) による制御を、従来の 3D diffusion が届かなかった忠実度で実現しました。"
    limitations: "geometry-first は多段のパイプラインを意味します — 形状、次にリメッシュと UV 展開、次に PBR マテリアル — 著者ら自身も「まだ完全な end-to-end ではない」と認めています。しかも latent は形状だけを符号化し、一つの occupancy 場へデコードするのみ。積み残した願いは、幾何と見た目をまとめて担う構造を持つ一つの latent が、望むどの表現へでも一度の生成でデコードすること (→ TRELLIS) です。"
