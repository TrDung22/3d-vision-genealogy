title: "2D Gaussian Splatting for Geometrically Accurate Radiance Fields"
short: "2D Gaussian Splatting (2024)"
authors: "Binbin Huang, Zehao Yu, Anpei Chen, Andreas Geiger, Shenghua Gao"
venue: "SIGGRAPH 2024"
year: 2024
branch: neural-rendering
lane: gaussians
links:
  arxiv: "https://arxiv.org/abs/2403.17888"
  project: "https://surfsplatting.github.io/"
problem: >
  3DGS looks right and measures wrong: a ray meets a 3D blob at a different
  depth from every viewpoint, so the "surface" it implies is
  view-inconsistent — extracted meshes come out noisy.
solution: >
  Flatten the primitive: oriented 2D Gaussian disks (surfels) with exact
  perspective-correct ray-splat intersection instead of screen-space
  approximation, plus depth-distortion and normal-consistency
  regularizers — splatting that renders AND reconstructs.
limitations: >
  Surfels assume the world is opaque surfaces: by its own account
  semi-transparent ones such as glass trip it up, its densification favors
  texture-rich over geometry-rich regions, and its regularizers trade some
  image quality for the geometry gains.
relations:
  - node: 3dgs2023
    type: fixes
    note: >
      Repairs the geometric lie in the primitive itself: replacing volumetric
      blobs with oriented disks makes the represented surface view-consistent,
      turning splatting from a view-synthesis trick into a reconstruction
      method.
  - node: ewa2001
    type: builds-on
    note: >
      Completes the EWA revival: 3DGS brought back Zwicker's volume
      splatting; 2DGS brings back the other half — SURFACE splatting with
      oriented surfels — now recovered from photos alone, where earlier surfel
      methods, even differentiable ones, needed known geometry or depth.
status: seed
