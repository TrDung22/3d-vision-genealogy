title: "RAFT: Recurrent All-Pairs Field Transforms for Optical Flow"
short: "RAFT (2020)"
authors: "Zachary Teed, Jia Deng (Princeton University)"
venue: "ECCV 2020 (Oral, Best Paper Award)"
year: 2020
branch: multi-view-geometry
lane: features
links:
  arxiv: "https://arxiv.org/abs/2003.12039"
  code: "https://github.com/princeton-vl/RAFT"
problem: >
  Optical flow, the per-pixel motion between two frames, had been a
  hand-built energy for decades — a data term traded against a smoothness
  prior — and further progress looked hard because of "the difficulties in
  hand-designing an optimization objective that is robust to a variety of
  corner cases". Deep networks had matched the best classical methods while
  running much faster, but most estimated flow coarse-to-fine, which makes
  errors at coarse resolution hard to undo, misses small fast-moving
  objects, and often takes over a million iterations to train.
solution: >
  Keep a single flow field at one resolution and refine it the way an
  optimizer would, with every piece learned. A feature encoder embeds each
  pixel of both frames at 1/8 scale; inner products over ALL pairs of
  pixels form a 4D correlation volume, pooled into a pyramid so that every
  lookup sees small and large displacements at once; a convolutional GRU,
  its weights tied across iterations, reads correlation, current flow and
  context features and proposes the next update — 2.7M parameters that
  "can be applied 100+ times during inference without divergence". It cut
  Sintel (final) end-point error by 30% to 2.855 px and KITTI F1-all by 16%
  to 5.10%, and was ECCV 2020's Best Paper.
limitations: >
  Two frames and 2D motion: it outputs flow, not cameras or depth. Its
  accuracy is bought with iterations — GMFlow (CVPR 2022) objected that
  "such a large number of sequential refinements introduce linearly
  increasing inference time", and matched pixels globally instead. Its
  all-pairs volume grows as O(N²) in the pixel count: no bottleneck for one
  pair at video size, by its own measurements, but when its authors carried
  the design into SLAM, storing every pair's volume "would quickly exceed
  video memory", and DROID-SLAM fell back on RAFT's on-demand lookup.
