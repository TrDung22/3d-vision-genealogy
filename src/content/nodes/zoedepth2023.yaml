title: "ZoeDepth: Zero-shot Transfer by Combining Relative and Metric Depth"
short: "ZoeDepth (2023)"
authors: "Shariq Farooq Bhat, Reiner Birkl, Diana Wofk, Peter Wonka, Matthias Müller"
venue: "arXiv 2023 (Intel)"
year: 2023
branch: single-image-3d
lane: depth
links:
  arxiv: "https://arxiv.org/abs/2302.12288"
  code: "https://github.com/isl-org/ZoeDepth"
problem: >
  The metric debt of the MiDaS line: relative depth generalizes but can't say
  "how many meters", which blocks SLAM, AR, and robotics.
solution: >
  A widely used bridge from relative to metric, and by its own account the
  first to combine the two: pre-train a MiDaS-style relative backbone on the
  dataset mix, then bolt on a lightweight metric-bins head fine-tuned on metric
  data — keeping generalization while restoring absolute scale.
limitations: >
  The metric head is still domain-bound (separate indoor/outdoor heads with a
  router), so scale is learned per domain rather than resolved; and, as
  UniDepth later found, it "shows limitations in general zero-shot
  scenarios".
relations:
  - node: midas2020
    type: fixes
    note: >
      Repairs exactly the debt MiDaS chose to take on: absolute scale — by
      appending a metric-bins module to the relative-depth backbone instead of
      retraining from scratch.
    i18n:
      ja:
        note: "MiDaS が承知の上で背負った借金 — 絶対スケール — を直します。ゼロから学習し直すのではなく、相対深度バックボーンに metric-bins モジュールを継ぎ足して。"
status: seed
i18n:
  ja:
    problem: "MiDaS 路線の metric の借金 — 相対深度は汎化しても「何メートルか」は言えず、SLAM、AR、ロボティクスの手前で立ち往生します。"
    solution: "相対から metric への、広く使われた橋です — 本人たちによれば、両者を組み合わせた最初の手法でもあります。MiDaS 流の相対バックボーンをデータセット混合で事前学習し、その上に軽量な metric-bins ヘッドを載せて metric データで微調整 — 汎化を保ったまま絶対スケールを取り戻しました。"
    limitations: "metric ヘッドは依然ドメインに縛られ (屋内用と屋外用のヘッド + ルーター)、スケールは解かれたのではなく、ドメインごとに学習されたにすぎません。そして後に UniDepth が示したとおり、「一般的なゼロショットの状況では限界を見せる」のです。"
