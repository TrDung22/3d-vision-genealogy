title: "Distinctive Image Features from Scale-Invariant Keypoints"
short: "SIFT (1999)"
authors: "David G. Lowe (University of British Columbia)"
venue: "IJCV 2004 (conference version: ICCV 1999)"
year: 1999
branch: multi-view-geometry
lane: features
links:
  paper: "https://www.cs.ubc.ca/~lowe/papers/iccv99.pdf"
  journal: "https://link.springer.com/article/10.1023/B:VISI.0000029664.99615.94"
problem: >
  Image matching sits under object recognition, 3D structure from multiple
  images, stereo and motion tracking, and it needs local features that are
  invariant to scale and rotation, robust to lighting and viewpoint, and
  distinctive enough to find their one correct match in a large database.
  By Lowe's 1999 account, object recognition was hard "due in large part to
  the lack of success in finding such image features".
solution: >
  A cascade of filters that finds such points and describes them. Keypoints
  are extrema of a difference-of-Gaussian scale space, located by fitting a
  3D quadratic and purged of low-contrast and edge responses; each gets a
  dominant gradient orientation (sometimes several), and its descriptor is
  computed in that rotated, scaled frame: a 4x4 grid of 8-bin orientation
  histograms, 128 numbers normalized against illumination. A typical
  500x500 image yields about 2000 features. Matching is a nearest-neighbor
  search with a ratio test: a match is rejected when the nearest neighbor
  is not clearly closer than the second (distance ratio above 0.8), which
  "eliminates 90% of the false matches while discarding less than 5% of the
  correct matches".
limitations: >
  Hand-designed end to end, and by its own account unfinished: the features
  "use only a monochrome intensity image", they had yet to be tested
  systematically on "data sets with full 3D viewpoint and illumination
  changes", and Lowe expected future feature sets to "contain both prior and
  learned features". The learned successors named the rest. SuperPoint
  faulted pipelines that detect first and describe afterwards, which "lack
  the ability to share computation and representation across the two
  tasks"; SuperGlue, matching over all candidates "rather than the limited
  set of nearest neighbors", found up to ten times more correct matches than
  the ratio test on SIFT's own features. Yet it never left the pipelines:
  MASt3R still credits precision and speed for "the success and persistence
  of SIFT" in reconstruction pipelines like COLMAP.
relations: []
status: seed
i18n:
  ja:
    problem: "画像マッチングは、物体認識、複数画像からの3D構造の復元、ステレオ、動きの追跡の土台にあります。そこで必要なのは、スケールと回転に不変で、照明や視点の変化にも強く、しかも大きなデータベースの中からただ一つの正しい相手を見つけられるほど識別性の高い局所特徴でした。1999年の Lowe によれば、物体認識が難しいのは「主として、そうした画像特徴を見つけることに成功してこなかったため」でした。"
    solution: "そうした点を見つけて記述するための、段階的なフィルタの連なりです。キーポイントは Difference-of-Gaussian のスケール空間の極値で、3次元の二次関数を当てはめて位置を補間し、コントラストの低い点とエッジ上の応答を取り除きます。各キーポイントには主要な勾配方向を一つ (ときに複数) 割り当て、その回転とスケールに合わせた座標系で記述子を計算します — 8方向の勾配ヒストグラムを4x4に並べた128個の数値で、照明の影響を抑えるよう正規化したものです。500x500 の典型的な画像からは約2000個の特徴が得られます。マッチングは最近傍探索に ratio test を組み合わせたもので、最近傍が2番目の候補よりはっきり近くなければ (距離の比が0.8を超えれば) その対応を捨てます。これで「誤った対応の90%を取り除き、正しい対応は5%未満しか捨てない」のです。"
    limitations: "最初から最後まで手で設計されたもので、本人の言うとおり未完成でもありました。特徴は「モノクロの輝度画像しか使わず」、「3D の視点変化と照明変化を完全に含むデータセット」での体系的な検証はまだで、Lowe は将来の特徴集合が「prior な特徴と学習された特徴の両方を含む」だろうと見ていました。残りは学習ベースの後継が名指ししました。SuperPoint は、先に検出してから記述するパイプラインが「二つのタスクのあいだで計算と表現を共有する能力を欠いている」と指摘しました。SuperGlue は「最近傍の限られた集合」ではなくすべての候補を相手にマッチングし、SIFT 自身の特徴の上で ratio test の最大10倍の正しい対応を見つけました。それでも SIFT はパイプラインから消えませんでした — MASt3R は、精度と速さこそが COLMAP のような再構成パイプラインにおける「SIFT の成功と根強さ」を説明すると認めています。"
