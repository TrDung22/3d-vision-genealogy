title: "UniDepth: Universal Monocular Metric Depth Estimation"
short: "UniDepth (2024)"
authors: "Luigi Piccinelli, Yung-Hsu Yang, Christos Sakaridis, Mattia Segu, Siyuan Li, Luc Van Gool, Fisher Yu"
venue: "CVPR 2024 (Highlight)"
year: 2024
branch: single-image-3d
lane: depth
links:
  arxiv: "https://arxiv.org/abs/2403.18913"
  code: "https://github.com/lpiccinelli-eth/UniDepth"
problem: >
  Metric depth without being told the camera: Metric3D-style approaches still
  assume intrinsics are available at test time.
solution: >
  Predict the camera itself: a self-promptable camera module estimates a dense
  camera representation which conditions the depth decoder, with a spherical
  (pseudo-spherical) output parameterization that disentangles camera from
  depth — universal metric 3D from a bare image.
limitations: >
  Camera self-estimation is the new weakest link — errors in inferred
  intrinsics leak directly into metric scale, and fine detail still trails the
  relative-depth foundation models.
relations:
  - node: metric3d2023
    type: fixes
    note: >
      Repairs the test-time assumption UniDepth diagnoses in Metric3D (and
      ZeroDepth): generalizable metric depth that still assumes "controlled
      setups at test time, including camera intrinsics", so camera noise "is
      directly injected into the model". Metric3D normalizes a given camera
      away (canonical space); UniDepth predicts the camera from the image.
  - node: zoedepth2023
    type: fixes
    note: >
      Repairs the weakness UniDepth diagnoses in ZoeDepth, a model pitched
      on zero-shot transfer: with a capacity similar to UniDepth's ViT model
      and pre-training on the diverse MiDaS mix, ZoeDepth still "shows
      limitations in general zero-shot scenarios", "exhibiting performance
      comparable to traditional MMDE methods especially on scale-invariant
      metrics". ZoeDepth's flagship learns metric scale by fine-tuning on two
      datasets, one light head per domain; UniDepth trains a single model on
      roughly 3M images from many cameras and domains, and conditions its
      depth on a camera it predicts from the image.
status: seed
