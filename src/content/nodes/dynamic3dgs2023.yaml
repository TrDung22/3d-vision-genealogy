title: "Dynamic 3D Gaussians: Tracking by Persistent Dynamic View Synthesis"
short: "Dynamic 3D Gaussians (2023)"
authors: "Jonathon Luiten, Georgios Kopanas, Bastian Leibe, Deva Ramanan"
venue: "3DV 2024"
year: 2023
branch: dynamic-4d
lane: gaussians
links:
  arxiv: "https://arxiv.org/abs/2308.09713"
  project: "https://dynamic3dgaussians.github.io/"
  code: "https://github.com/JonathonLuiten/Dynamic3DGaussians"
problem: >
  Dynamic view synthesis and dense long-term tracking had grown up apart.
  Dynamic NeRFs on spacetime grids say nothing about correspondence over
  time, canonical warps give only backward maps from each frame to one
  reference, and learned point trackers mostly train on synthetic tracks
  and work in 2D. Could one representation render a moving scene in real
  time and also know where every piece of it went?
solution: >
  Let 3D Gaussian Splatting's Gaussians persist through time: color,
  opacity and size stay fixed, only position and rotation change, so each
  Gaussian is an oriented particle. Fitted online, one timestep after
  another, to multi-view video, with local-rigidity, rotation-similarity and
  long-term isometry priors on neighbouring particles, the Gaussians yield
  dense 6-DOF tracks with no flow or correspondence as input. On Panoptic
  Studio sequences with 27 training cameras: 28.7 dB at 850 fps, 2 hours of
  training on one RTX 3090, a 3D tracking error of 2.21 cm, and a 2D
  tracking error of 1.57 against PIPs' 15.7.
limitations: >
  By its own account it can only track what is visible in the first frame
  ("It would completely fail to reconstruct new objects entering the
  scene"), and it "requires a multi-camera setup and does not work
  off-the-shelf on monocular video"; on Panoptic it also takes its initial
  point cloud from the dome's depth cameras. Storing every Gaussian's
  position and rotation at every timestep makes memory grow linearly with
  the length of the video, as 4D Gaussian Splatting diagnosed.
relations:
  - node: 3dgs2023
    type: builds-on
    note: >
      Extends 3DGS from static to dynamic scenes ten days after 3DGS reached
      arXiv, with one of its authors on board: "In this paper we extend this
      approach from modelling only static scenes to dynamic scenes." The
      Gaussians and the rasterizer are 3DGS's; what is new is persistence,
      the same Gaussians carried through time. Its baseline is 3DGS itself,
      run online frame by frame: 28.21 vs 28.7 dB, but 3D tracks 55.9 cm off
      against 2.21 cm.
    i18n:
      ja:
        note: "3DGS が arXiv に出た十日後、その著者の一人を加えて、3DGS を静的シーンから動的シーンへ広げます。「本論文では、この手法を静的シーンのみのモデリングから動的シーンへと拡張する」。ガウシアンもラスタライザーも 3DGS のもので、新しいのは持続性 — 同じガウシアンを時間を通じて運ぶこと — です。比較対象は 3DGS そのものをフレームごとにオンラインで当てはめたもので、28.21 dB 対 28.7 dB、ただし 3D の軌跡誤差は 55.9 cm 対 2.21 cm でした。"
status: seed
i18n:
  ja:
    problem: "動的な novel view synthesis と、密で長期的な点の追跡は、別々に育ってきました。時空間グリッド上の動的 NeRF は時間を通じた対応関係について何も語らず、canonical への warp が与えるのは各フレームから一つの参照への後ろ向きの対応だけ。学習ベースの点トラッカーは多くが合成の軌跡で訓練され、2D で動きます。一つの表現で、動くシーンをリアルタイムに描画しつつ、そのあらゆる部分がどこへ行ったかも知ることはできるでしょうか?"
    solution: "3D Gaussian Splatting のガウシアンを、時間の中で持続させます。色・不透明度・大きさは固定し、変わるのは位置と回転だけ — 各ガウシアンは向きを持つ粒子になります。マルチビュー動画に時刻を一つずつオンラインで当てはめ、近傍の粒子に局所剛性・回転の類似性・長期の等長性の prior をかけると、フローも対応関係も入力しないまま、ガウシアンから密な 6-DOF の軌跡が得られます。学習用カメラ27台の Panoptic Studio のシーケンスで、850 fps で 28.7 dB、RTX 3090 一枚で2時間の学習、3D 追跡誤差 2.21 cm、2D 追跡誤差は PIPs の 15.7 に対して 1.57 です。"
    limitations: "論文自身によれば、追跡できるのは最初のフレームで見えている部分だけで (「シーンに入ってくる新しい物体の再構成には完全に失敗する」)、「マルチカメラの構成を必要とし、単眼動画ではそのままでは動かない」。Panoptic では、初期点群も撮影ドームの深度カメラから得ています。すべてのガウシアンの位置と回転を時刻ごとに保存するため、メモリは動画の長さに比例して増えます — 4D Gaussian Splatting の診断です。"
