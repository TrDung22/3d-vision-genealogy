title: "Efficient Geometry-aware 3D Generative Adversarial Networks"
short: "EG3D (2021)"
authors: "Eric R. Chan, Connor Z. Lin, Matthew A. Chan, Koki Nagano, Boxiao Pan, Shalini De Mello, Orazio Gallo, Leonidas Guibas, Jonathan Tremblay, Sameh Khamis, Tero Karras, Gordon Wetzstein (Stanford, NVIDIA)"
venue: "CVPR 2022 (Oral)"
year: 2021
branch: neural-rendering
lane: efficiency
links:
  arxiv: "https://arxiv.org/abs/2112.07945"
  code: "https://github.com/NVlabs/eg3d"
  project: "https://nvlabs.github.io/eg3d/"
problem: >
  3D-aware GANs learn faces and cats from collections of single-view photos,
  but a GAN must render tens of millions of images. Fully implicit generators
  are too slow for high resolution, and the shortcut, upsampling in image
  space, "sacrifices view consistency and impairs the quality of the learned
  3D geometry".
solution: >
  The TRI-PLANE: a StyleGAN2 generator paints features onto three
  axis-aligned planes; a 3D point sums its three projections, a
  one-hidden-layer MLP reads out density and features, and volume rendering
  projects them into an image. Planes cost N², not N³, and being 2D they can
  be painted by an off-the-shelf 2D CNN; dual discrimination keeps the
  upsampled output true to the raw render. FID 4.7 on FFHQ at 512², in real
  time.
limitations: >
  By its own account the tri-plane is still too slow to render natively at
  high resolution, so EG3D volume-renders at 128² and upsamples in image
  space, an approximation that dual discrimination restrains but does not
  remove; it also needs the dataset's camera-pose distribution, and its
  shapes "lack finer details, such as individual teeth". K-Planes later
  showed that summing the planes cannot make "spatially localized signals".
  The tri-plane outlived the GAN: LRM predicts one straight from an image.
relations:
  - node: nerf2020
    type: builds-on
    note: >
      Keeps NeRF's renderer — density and features volume-rendered with
      NeRF's two-pass importance sampling — and carries it into a new
      direction, unsupervised 3D generation from single-view photos. What
      changes is the field: EG3D finds NeRF-style MLPs "slow to evaluate as
      each query requires a full pass through the network", so it reads
      features off planes through a one-hidden-layer decoder (7.8x faster
      than Mip-NeRF at 0.06x the memory, in its GAN setting).
  - node: neuralvolumes2019
    type: fixes
    note: >
      Repairs the dense grid's cubic memory: Neural Volumes itself names
      limited resolution "its main drawback", and EG3D, citing it, says such
      grids "incur heavy memory overheads". Three planes cost N² rather than
      N³, so equal memory buys finer features; in EG3D's single-scene test
      the tri-plane beats a dense feature volume of equal capacity on PSNR
      and SSIM.
status: seed
