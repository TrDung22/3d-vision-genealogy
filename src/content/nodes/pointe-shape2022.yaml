title: "Point-E and Shap-E: Diffusion Straight onto 3D"
short: "Point-E / Shap-E (2022)"
authors: "Alex Nichol, Heewoo Jun, Prafulla Dhariwal, Pamela Mishkin, Mark Chen (OpenAI)"
venue: "arXiv 2022 / 2023"
year: 2022
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2212.08751"
  code: "https://github.com/openai/shap-e"
problem: >
  State-of-the-art text-to-3D in 2022 meant per-prompt optimization —
  DreamFusion needed multiple GPU-hours (~12 V100-hours, by Point-E's count)
  to hallucinate one object by distilling a 2D diffusion prior. Generation was
  slow, indirect, and never touched 3D data itself.
solution: >
  OpenAI's answer: run diffusion DIRECTLY on a 3D representation. Point-E
  generates a colored point cloud from a text or image prompt in 1-2 minutes on
  a single GPU; Shap-E goes further, diffusing the PARAMETERS of an implicit
  function that decodes to both a NeRF and a mesh. No per-scene optimization —
  just a diffusion sampling run. This is an early seed of native 3D
  generation: learn the distribution of 3D itself, rather than distilling it
  out of a 2D model.
limitations: >
  Geometry is coarse and blobby, texture low-fidelity — a "relatively low
  resolution", Point-E concedes; samples that "often look rough or lack fine
  details", says Shap-E, which blames its weak compositionality on "limited
  paired training data". The recipe was proven but under-powered: as CLAY
  later diagnosed, such models were too small and under-used the geometry in
  their data — quality arrived with a larger model on carefully processed data
  (→ CLAY), drawn from open web-scale corpora (→ Objaverse).
relations: []
status: seed
i18n:
  ja:
    problem: "2022年の最先端のテキストから3Dは、プロンプトごとの最適化を意味しました — DreamFusion は 2D diffusion の prior を蒸留し、一つの物体を幻視するのに数 GPU 時間 (Point-E の換算で V100 約12時間) を要します。生成は遅く、間接的で、3Dデータそのものには一切触れませんでした。"
    solution: "OpenAI の答えは、diffusion を3D表現の上で直接回すことでした。Point-E はテキストや画像のプロンプトから色付き点群を、1枚の GPU で1〜2分で生成します。Shap-E はさらに進んで、NeRF にもメッシュにもデコードできる陰関数のパラメータそのものを diffuse します。シーンごとの最適化はなく、diffusion のサンプリングを一度回すだけ。これが native 3D generation の早い種です — 3D を2Dモデルから蒸留するのではなく、3D そのものの分布を学ぶのです。"
    limitations: "幾何は粗くぼってりし、テクスチャの忠実度も低い — Point-E は「比較的低い解像度」を認め、Shap-E はサンプルが「しばしば粗く、細部を欠く」と述べたうえで、概念を組み合わせる力の弱さを「ペアになった学習データの不足」のせいにしています。レシピは実証されたものの、力不足でした。後に CLAY が診断したとおり、こうしたモデルは小さすぎ、データに埋もれた幾何を活かしきれていなかった — 品質は、より大きなモデルを丁寧に処理したデータで学習して初めて訪れ (→ CLAY)、そのデータはオープンなウェブ規模のコーパスから来ました (→ Objaverse)。"
