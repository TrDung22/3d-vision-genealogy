title: "Probing the 3D Awareness of Visual Foundation Models"
short: "Banani et al. 2024"
authors: "Mohamed El Banani, Amit Raj, Kevis-Kokitsi Maninis, Abhishek Kar, Yuanzhen Li, Michael Rubinstein, Deqing Sun, Leonidas Guibas, Justin Johnson, Varun Jampani"
venue: "CVPR 2024"
year: 2024
branch: single-image-3d
lane: depth
kind: analysis
links:
  arxiv: "https://arxiv.org/abs/2404.08636"
  paper: "https://openaccess.thecvf.com/content/CVPR2024/html/Banani_Probing_the_3D_Awareness_of_Visual_Foundation_Models_CVPR_2024_paper.html"
problem: >
  The uncomfortable question of the borrow-a-2D-prior era: when we repurpose
  DINOv2, CLIP, or Stable Diffusion for 3D tasks, how much 3D do those models
  actually contain?
solution: >
  A probing study of frozen features — trainable probes and zero-shot
  matching — on two capabilities: encoding the visible surface (depth,
  surface normals) and staying consistent across views (correspondence).
  Single-view, the verdict varies widely by model: DINOv2 encodes depth and
  normals best with Stable Diffusion a close second, and vision-language
  models such as CLIP are the notable exception. Across views, every model
  breaks down under large viewpoint changes: the representations are
  "view-consistent, not 3D consistent".
limitations: >
  By its own account only "a first step": the checkpoints it compares were
  trained on different data at different scales, its probes are deliberately
  minimal, and it tests just two basic aspects of 3D awareness. It diagnoses
  the multiview gap without proposing a cure; what later work built on was
  the positive half — DINOv2's grip on the visible surface.
relations: []
status: seed
i18n:
  ja:
    problem: "2D の事前知識を借りる時代の、居心地の悪い問い — DINOv2 や CLIP、Stable Diffusion を3Dタスクに流用するとき、それらのモデルは実際どれほどの3Dを内包しているのか?"
    solution: "凍結した特徴を調べる probing 研究です — 学習可能なプローブとゼロショットの対応付けで、二つの能力を測ります。見えている表面を符号化できるか (深度・表面法線)、そして視点をまたいで一貫しているか (対応点)。単一視点での判定はモデルによって大きく異なります。深度と法線を最もよく符号化するのは DINOv2 で、Stable Diffusion が僅差で続き、CLIP のような視覚言語モデルは顕著な例外です。視点をまたぐと、大きな視点変化の前ではどのモデルも崩れます。表現は「視点ごとには一貫していても、3D として一貫してはいない」のです。"
    limitations: "本人たちの言うとおり「第一歩」にすぎません。比べたチェックポイントは学習データも計算規模もまちまちで、プローブは意図的に最小限、テストしたのも3D認識のごく基本的な二つの側面だけです。多視点のギャップを診断しても、治し方は示しません。後の研究がその上に築いたのは肯定的な半分 — 見えている表面を DINOv2 がしっかり捉えている、という知見でした。"
