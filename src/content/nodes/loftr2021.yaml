title: "LoFTR: Detector-Free Local Feature Matching with Transformers"
short: "LoFTR (2021)"
authors: "Jiaming Sun, Zehong Shen, Yuang Wang, Hujun Bao, Xiaowei Zhou (Zhejiang University + SenseTime Research)"
venue: "CVPR 2021"
year: 2021
branch: multi-view-geometry
lane: features
links:
  arxiv: "https://arxiv.org/abs/2104.00680"
  project: "https://zju3dv.github.io/loftr/"
  code: "https://github.com/zju3dv/LoFTR"
problem: >
  Detect, describe, match: even with SuperGlue, a matcher could only pair
  the points a detector found, and "a feature detector may fail to extract
  enough interest points that are repeatable between images" under poor
  texture, repetitive patterns, viewpoint or illumination change and motion
  blur, above all indoors, where low-texture regions or repetitive patterns
  can fill most of the view. Detector-free dense matchers (NCNet and its
  successors) skipped detection, but their CNN features have a "limited
  receptive field which may not distinguish indistinctive regions".
solution: >
  Drop the detector. A CNN with a feature pyramid extracts coarse (1/8
  resolution) and fine (1/2) feature maps from both images; the coarse maps
  pass through interleaved self- and cross-attention layers, SuperGlue's
  attention applied to every location instead of detected keypoints and
  made affordable by linear attention. Dense matches are read off the
  transformed features with a dual-softmax (or optimal transport) at the
  coarse level, and each confident match is refined to sub-pixel accuracy
  in a local window of the fine maps. The global receptive field lets it
  place a texture-less wall by its position relative to the edges around
  it.
limitations: >
  By its own account the vanilla Transformer "is impractical even when the
  input length is reduced by the local feature CNN" to a 1/8-resolution
  grid, so attention has to be linearized; it leaves "matching images with
  severe seasonal changes" to future work, and its own table has
  SuperPoint + SuperGlue still slightly ahead in daytime localization on
  Aachen. MASt3R later noted that even LoFTR scores "a relatively
  disappointing VCRE precision of 34%" on the Map-free benchmark, and
  blamed practically all matchers for "treating matching as a 2D problem in
  image space", the opening for matching grounded in 3D.
relations:
  - node: superglue2019
    type: fixes
    note: >
      Repairs the weakness LoFTR names in SuperGlue: "being a
      detector-dependent method, it has the fundamental drawback of being
      unable to detect repeatable interest points in indistinctive regions",
      and "The attention range in SuperGlue is also limited to the detected
      interest points only." LoFTR keeps SuperGlue's self- and
      cross-attention but runs it over dense features, with no detector at
      all. Against SuperPoint + SuperGlue, pose AUC@20° rises from 51.84 to
      57.62 on ScanNet and from 75.96 to 81.18 on MegaDepth (dual-softmax
      variant).
