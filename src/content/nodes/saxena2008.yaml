title: "Make3D: Learning 3D Scene Structure from a Single Still Image"
short: "Make3D (Saxena 2008)"
authors: "Ashutosh Saxena, Min Sun, Andrew Y. Ng"
venue: "TPAMI 2009"
year: 2008
branch: single-image-3d
lane: priors
links:
  project: "http://make3d.cs.cornell.edu/"
problem: >
  A continuous depth map (not just a few discrete geometric classes) for an
  arbitrary scene, from a single image.
solution: >
  An MRF over superpixels with hand-crafted multi-scale features; regress the
  orientation and depth of each small planar patch, then stitch them into the
  scene surface.
limitations: >
  Hand-designed features and an MRF over superpixels — and that "who designs
  the features?" limitation is exactly the door deep learning walked through
  six years later. As Eigen et al. noted, the system also "relies on
  horizontal alignment of images, and suffers in less controlled settings".
relations:
  - node: hoiem2005
    type: fixes
    note: >
      Make3D names the weakness of Hoiem et al.'s pop-up models: they assume "a
      flat ground with vertical walls", so they do not apply to scenes such as
      mountains, trees, staircases, or arches. The fix: small planes free to
      take any orientation and depth — qualitatively correct models on 64.9% of
      588 internet images, against 33.1% for Hoiem et al.
status: seed
