title: "UNISURF: Unifying Neural Implicit Surfaces and Radiance Fields for Multi-View Reconstruction"
short: "UNISURF (2021)"
authors: "Michael Oechsle, Songyou Peng, Andreas Geiger"
venue: "ICCV 2021 (Oral, per authors' README)"
year: 2021
branch: neural-rendering
lane: surfaces
links:
  arxiv: "https://arxiv.org/abs/2104.10078"
  project: "https://moechsle.github.io/unisurf/"
  code: "https://github.com/autonomousvision/unisurf"
problem: >
  Two ways to learn a surface from images, each missing half. Surface
  rendering (DVR, IDR) gives accurate geometry but needs per-pixel object
  masks, because its gradients exist only where a ray meets the surface.
  NeRF needs no masks, but its density is not a surface: level sets of it
  come out non-smooth and full of artifacts.
solution: >
  Read NeRF's alpha as occupancy. For solid objects, alpha compositing
  reduces to taking the color of the first occupied sample, so UNISURF
  predicts an occupancy field instead of a density and can render it both
  ways. Training starts with samples spread over the whole volume, which
  settles coarse structure without masks, then squeezes them into a
  shrinking interval around the surface found by root-finding — volume
  rendering that, in the limit, becomes surface rendering.
limitations: >
  Solid, opaque surfaces only, by design; by its own account overexposed,
  textureless and rarely seen regions still come out inaccurate or rough,
  even with the explicit smoothness term it adds. NeuS, comparing on DTU,
  credits its SDF zero-level set with "better reconstruction accuracy than
  UNISURF", the gap showing on objects with abrupt depth changes.
relations:
  - node: nerf2020
    type: fixes
    note: >
      Repairs the geometry under NeRF's density, which UNISURF diagnoses
      directly: level sets of it "are usually non-smooth and contain
      artifacts" because the radiance field "does not sufficiently constrain
      the 3D geometry in the presence of ambiguities". Predicting occupancy
      instead of density keeps NeRF's mask-free volume rendering and gives
      the optimization a surface to converge to.
  - node: occnet2019
    type: builds-on
    note: >
      Same group (Oechsle and Geiger are on both papers): the geometry is an
      Occupancy Network, the surface its 0.5 decision boundary, and meshes
      come out through that paper's multiresolution extraction (MISE). What
      changes is the supervision — images through volume rendering instead
      of ground-truth 3D shapes (the group's DVR had already used images,
      through surface rendering and with masks).
  - node: dvr2019
    type: fixes
    note: >
      Repairs the mask dependence of the group's own surface renderer. DVR
      had named circumventing "the need for object masks" as future work,
      and UNISURF names the cause: the "key hypothesis" of DVR and IDR, that
      "only the region at the first intersection point with the surface
      contributes to the rendering equation", "is not true during early
      iterations where the surface is not well defined". UNISURF keeps DVR's
      occupancy field and root-finding, now to center a shrinking
      volume-rendering interval on the surface.
  - node: idr2020
    type: fixes
    note: >
      Repairs IDR's dependence on masks, which UNISURF shows directly:
      methods like IDR "require object masks and careful initialization for
      capturing accurate geometry". UNISURF still starts from a sphere, but
      without masks it comes close to masked IDR on DTU (mean Chamfer 1.02
      against 0.90); on BlendedMVS and SceneNet scenes, which by its account
      have no object masks, it reports of its IDR attempts that "none of the
      scenes converged".
status: seed
