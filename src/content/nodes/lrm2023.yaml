title: "LRM: Large Reconstruction Model for Single Image to 3D"
short: "LRM (2023)"
authors: "Yicong Hong, Kai Zhang, Jiuxiang Gu, Sai Bi, Yang Zhou, Difan Liu, Feng Liu, Kalyan Sunkavalli, Trung Bui, Hao Tan"
venue: "ICLR 2024 (Oral)"
year: 2023
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2311.04400"
  project: "https://web.archive.org/web/20240323235048/https://yiconghong.me/LRM/"
problem: >
  The Zero-1-to-3 line's per-object optimization is too slow for real
  applications: we need one image → 3D in a single forward pass.
solution: >
  A half-billion-parameter transformer predicting a triplane-NeRF DIRECTLY from
  the image, trained end-to-end on Objaverse + MVImgNet — modeled, by its own
  account, on the GPT recipe: replace the optimization pipeline with one large
  model trained on large data.
limitations: >
  Blurry textures on occluded sides (by its own account, a probabilistic
  problem squeezed into one deterministic prediction), shapes distorted when
  its fixed camera assumption is wrong, and no released code or weights — the
  community had to reimplement it (OpenLRM, six weeks later).
relations:
  - node: zero123-2023
    type: fixes
    note: >
      Repairs the bottleneck LRM names in the line Zero-1-to-3 belongs to:
      diffusion-guided methods "require delicate parameter tuning and
      regularization", and per-shape NeRF optimization "is often slow and
      impractical". It drops per-object SDS optimization for a single
      ~1-second forward pass.
  - node: nerf2020
    type: builds-on
    note: >
      The output is a triplane radiance field — NeRF infrastructure, but
      PREDICTED rather than optimized.
  - node: eg3d2021
    type: builds-on
    note: >
      Its triplane is EG3D's: LRM employs "the triplane-NeRF formulation" and
      picks "the triplane spatial encoding function proposed by EG3D" for its
      O(N²) tokens rather than a voxel grid's O(N³) — the planes a GAN once
      painted, now regressed from a single image by a transformer.
  - node: objaverse2023
    type: builds-on
    note: >
      Its bet rests on the data as much as the model: LRM trains end-to-end on
      ~730K Objaverse assets plus ~220K MVImgNet videos, and credits the
      "combination of a high-capacity model and large-scale training data"
      for its generalization.
status: seed
