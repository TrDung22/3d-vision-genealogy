title: "ICON: Implicit Clothed humans Obtained from Normals"
short: "ICON (2021)"
authors: "Yuliang Xiu, Jinlong Yang, Dimitrios Tzionas, Michael J. Black"
venue: "CVPR 2022"
year: 2021
branch: single-image-3d
lane: human
links:
  arxiv: "https://arxiv.org/abs/2112.09127"
  paper: "https://openaccess.thecvf.com/content/CVPR2022/html/Xiu_ICON_Implicit_Clothed_Humans_Obtained_From_Normals_CVPR_2022_paper.html"
  project: "https://icon.is.tue.mpg.de/"
  code: "https://github.com/YuliangXiu/ICON"
problem: >
  Pixel-aligned implicits recover the hair and clothing a parametric body
  lacks, but break on in-the-wild poses: broken or disembodied limbs,
  missing details, non-human shapes. ICON names two causes — small,
  hand-curated scan datasets with very limited pose variation, and implicit
  functions fed by global image or voxel encoders that are "sensitive to
  global pose" — and, since varied 3D data remains scarce, it changes the
  model rather than the data.
solution: >
  Put a body in the loop and keep every feature local. A SMPL(-X) estimate
  (from PyMAF) is rendered into front and back body-normal maps that guide
  the prediction of clothed-body normals; the implicit surface is then
  regressed from local features alone — signed distance to the body, the
  nearest body point's normal, the clothed normal at the point's
  projection — none of which depends on global pose. At inference, a
  feedback loop alternates between refining the SMPL fit against the
  predicted normals and re-predicting them. State-of-the-art accuracy with
  as little as 12% of the training data, robustness to out-of-distribution
  poses and out-of-frame crops; per-frame reconstructions from video become
  an animatable avatar through a modified SCANimate.
limitations: >
  By its own account, the strong body prior is also a leash: loose clothing
  far from the body "may be difficult to reconstruct", a badly failed body
  fit becomes a failed reconstruction, and training on orthographic views
  leaves it struggling with strong perspective. ECON, its successor from
  the same group, sharpened the first point: ICON and PaMIR "regularize
  shape to a body shape, but over-constrain the skirts, or over-smooth the
  wrinkles". Looking ahead, ICON names a dataset of clothed avatars built
  from images alone as a key future application.
relations:
  - node: pifuhd2020
    type: fixes
    note: >
      Repairs the failure ICON diagnoses in PIFu and PIFuHD alike: their
      "shape reconstruction lacks regularization, and often produces
      artifacts like broken or disembodied limbs, missing details, or
      geometric noise". ICON keeps PIFuHD's front/back normal-map
      prediction, down to the network architecture, but conditions it on a
      SMPL body, and swaps the image encoder's global features for local,
      body-relative ones.
  - node: pymaf2021
    type: builds-on
    note: >
      Stands on PyMAF's body estimate. ICON's pipeline starts from a SMPL
      mesh, and it takes that mesh from PyMAF "due to its better
      mesh-to-image alignment compared to other methods"; the body conditions
      both of ICON's modules, the clothed-normal prediction and the
      body-relative local features of the implicit surface. Because "in
      practice, human pose and shape (HPS) regressors do not give
      pixel-aligned SMPL fits", ICON then carries the estimate further with
      a test-time loop that refines its shape, pose and translation against
      the predicted clothed-body normals and the silhouette.
