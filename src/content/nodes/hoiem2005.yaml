title: "Automatic Photo Pop-up"
short: "Photo Pop-up (Hoiem 2005)"
authors: "Derek Hoiem, Alexei A. Efros, Martial Hebert"
venue: "SIGGRAPH 2005"
year: 2005
branch: single-image-3d
lane: priors
links:
  project: "https://dhoiem.cs.illinois.edu/projects/popup/"
problem: >
  Building a walkable 3D model from a single outdoor photo, without a physical
  model of lighting or precise geometry.
solution: >
  Swap the kind of prior: learn a statistical classifier that labels image
  regions as ground / vertical / sky, then erect the scene like a children's
  pop-up book. One of the first times a STATISTICAL prior learned from data
  replaced the physical prior for single-image 3D.
limitations: >
  Only three coarse geometric classes, only outdoor scenes of a ground plane
  plus vertical objects; no continuous depth, and by its own account crowded
  scenes, hills and steps defeat it — about 30% of outdoor photos gave
  accurate models.
relations:
  - node: horn1970
    type: revives
    note: >
      Reawakened the single-image problem Horn had posed: by Pop-up's own
      account, automatic methods existed only for multiple images or video,
      and "no one has yet attempted automatic single-view modeling" — so it
      did, with statistical learning instead of reflectance physics.
status: seed
