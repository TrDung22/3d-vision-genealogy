title: "Structure-from-Motion Revisited"
short: "COLMAP (2016)"
authors: "Johannes L. Schönberger, Jan-Michael Frahm (UNC Chapel Hill + ETH Zürich)"
venue: "CVPR 2016"
year: 2016
branch: multi-view-geometry
lane: sfm
links:
  paper: "https://openaccess.thecvf.com/content_cvpr_2016/html/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.html"
  project: "https://colmap.github.io/"
  code: "https://github.com/colmap/colmap"
problem: >
  A decade after Photo Tourism, incremental SfM was "the most popular
  strategy" for unordered photo collections, yet still no general-purpose
  tool: "robustness, accuracy, completeness, and scalability remain the key
  problems". Systems would "fail to register a large fraction of images
  that empirically should be registrable", or break their models through
  mis-registration and drift.
solution: >
  Rebuild every stage of the incremental loop for robustness. Geometric
  verification labels each image pair as general, panoramic or planar, and
  drops pairs linked only by watermarks, timestamps or frames, so the
  reconstruction seeds only from non-panoramic pairs. The next image is
  chosen by a multi-resolution score of how many triangulated points it
  sees and how evenly they spread. Each feature track is triangulated by
  recursive RANSAC, recovering points a single mismatch had merged. Bundle
  adjustment, re-triangulation and filtering are iterated until they have
  little left to change, and redundant views in dense collections are
  grouped to cheapen bundle adjustment. Released open-source as COLMAP —
  today a full SfM and multi-view stereo pipeline, its MVS from a companion
  ECCV 2016 paper — it is where NeRF and 3DGS get their cameras.
limitations: >
  Still a chain of hand-built stages, and not the fastest: by its own
  account it "achieves slightly worse timings than VisualSFM". The
  feed-forward line named the rest. DUSt3R wrote that the SfM stage "is
  typically known to fail in many common situations" — few views,
  non-Lambertian surfaces, "insufficient or overly large camera motion".
  VGGT, calling COLMAP "the most popular framework based on the traditional
  pipeline", argued that such visual geometry "increases complexity and
  computational cost", and read the cameras off a single forward pass
  instead.
relations:
  - node: phototourism2006
    type: fixes
    note: >
      Repairs the weakness COLMAP diagnoses in Bundler, the released form of
      Photo Tourism's SfM, which it benchmarks as "Bundler [53]" (Photo
      Tourism): its track triangulation "is not robust to outliers, as it is
      not possible to recover independent points merged into one track", and
      "has significant computational cost due to exhaustive pairwise
      triangulation". COLMAP triangulates each track by recursive RANSAC
      instead. As a whole system it registers 20,918 of Rome's 74,394 photos
      to Bundler's 13,455 and, by its own measure, runs "more than 50 times
      faster than Bundler".
status: seed
