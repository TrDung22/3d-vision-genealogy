title: "3DShape2VecSet: A 3D Shape Representation for Neural Fields and Generative Diffusion Models"
short: "3DShape2VecSet (2023)"
authors: "Biao Zhang, Jiapeng Tang, Matthias Nießner, Peter Wonka (KAUST, TU Munich)"
venue: "SIGGRAPH 2023 (journal track, ACM TOG)"
year: 2023
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2301.11445"
  project: "https://1zb.github.io/3DShape2VecSet/"
  code: "https://github.com/1zb/3DShape2VecSet"
problem: >
  Diffusion had conquered images, but "the success in the 2D domain has not
  yet been matched in the 3D domain", and the missing piece was a shape
  representation to diffuse over. Neural fields give continuous, complete
  surfaces, yet their latents suit a generator badly: one global vector
  (Occupancy Networks, DeepSDF) "generally struggles to reconstruct
  high-quality shapes", while a regular grid of latents is too large to
  generate at anything but very low resolutions such as 8×8×8.
solution: >
  Drop the coordinates. After many variations the authors "could not improve
  on existing irregular grids" (their own 3DILG among them), so they kept the
  grid's interpolation but let the network encode position itself: a surface
  point cloud is cross-attended into a fixed-size SET of 512 latent vectors
  with no 3D positions attached, and occupancy at any query point is read out
  by cross-attention into that set. A KL bottleneck compresses the set for a
  second stage, an attention-based diffusion model that generates in that
  latent space, unconditionally or from a category, text, a partial point
  cloud or an image. On ShapeNet autoencoding it reaches 0.965 mean IoU
  (Occupancy Networks: 0.825), and the vector set became the latent that
  several of the large 3D generators of 2024–25 adopted (→ CLAY, Hunyuan3D 2,
  TripoSG).
limitations: >
  By its own account it is slow to train: it needs "a two stage training
  strategy", whose first stage is "more time consuming than relying on
  manually-designed features such as wavelets" and "might require retraining
  if the shape data in consideration changes", and whose diffusion stage is
  slow to train too. Its world is ShapeNet's 55 categories of man-made
  objects, seen through 2,048-point input clouds — the gap CLAY named when it
  scaled the vector set up: "In 3DShape2VecSet, the point clouds are
  generally of small sizes and therefore are insufficient to capture fine
  geometric details" (→ CLAY).
relations:
  - node: occnet2019
    type: fixes
    note: >
      Repairs the weakness it names in Occupancy Networks' design, a neural
      field driven by one global latent, where "a major limitation is the
      ability to encode shape details". It keeps Occupancy Networks' occupancy
      formulation (shapes preprocessed as Occupancy Networks did, the same
      binary cross-entropy loss) but swaps the single vector for a set of 512
      latents read out by cross-attention; on ShapeNet autoencoding, mean IoU
      rises from 0.825 for Occupancy Networks to 0.965.
status: seed
