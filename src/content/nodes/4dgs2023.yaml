title: "4D Gaussian Splatting for Real-Time Dynamic Scene Rendering"
short: "4D Gaussian Splatting (2023)"
authors: "Guanjun Wu, Taoran Yi, Jiemin Fang, Lingxi Xie, Xiaopeng Zhang, Wei Wei, Wenyu Liu, Qi Tian, Xinggang Wang"
venue: "CVPR 2024"
year: 2023
branch: dynamic-4d
lane: gaussians
links:
  arxiv: "https://arxiv.org/abs/2310.08528"
  project: "https://guanjunwu.github.io/4dgs/"
problem: >
  Dynamic radiance fields inherited NeRF's cost: the first ones trained for
  days (D-NeRF: two, on one GPU), and even the grid-based successors that
  cut training to minutes still rendered at roughly 1-2.5 fps — a video you
  can watch from anywhere, except not actually in real time.
solution: >
  One set of canonical 3D Gaussians deformed over time by a compact
  factored (HexPlane-style) field predicting per-Gaussian motion and shape
  change — dynamic scenes at 82 fps and 800x800, trained in minutes,
  storage kept modest by sharing the canonical Gaussians across time.
limitations: >
  By its own account, large motions, missing background points and imprecise
  poses make the 4D Gaussians hard to optimize, and on monocular video it can
  overfit the training views and fail on novel ones.
relations:
  - node: 3dgs2023
    type: builds-on
    note: >
      Extends splatting along the time axis within months: keeps the
      rasterization speed that made 3DGS a phenomenon and spends it on the
      dynamic setting where ray-marched methods were slowest.
    i18n:
      ja:
        note: "スプラッティングを時間軸へと数か月で拡張します。3DGS を現象にしたラスタライズの速度を保ち、それをレイマーチング系が最も遅かった動的設定へ注ぎ込みました。"
  - node: dnerf2020
    type: fixes
    note: >
      Repairs the render-speed collapse of deformation-based dynamic NeRFs:
      the same canonical+warp idea, but the Gaussians are deformed once per
      frame and splatted, instead of every ray sample being warped and
      queried through MLPs — from 1.5 fps for the deformation-based TiNeuVox
      to 82 fps on the same synthetic benchmark.
    i18n:
      ja:
        note: "変形ベースの動的 NeRF が抱えたレンダリング速度の崩壊を直します。同じ canonical + warp のアイデアながら、光線上のサンプルを一つずつ warp して MLP に問い合わせる代わりに、フレームごとにガウシアンを一度だけ変形させてスプラットする — 同じ合成ベンチマークで、変形ベースの TiNeuVox の 1.5 fps から 82 fps へ。"
status: seed
i18n:
  ja:
    problem: "動的放射輝度場は NeRF のコストを相続しました。初期の手法は学習に数日 (D-NeRF は GPU 1枚で2日) を要し、学習を数分に縮めたグリッド系の後継でさえ、描画は毎秒1〜2.5フレーム程度 — どこからでも見られる動画、ただし実際にはリアルタイムでない、を除いて。"
    solution: "一組の canonical な3Dガウシアンを、ガウシアンごとの動きと形状変化を予測するコンパクトな分解場 (HexPlane 風) が時間にわたって変形させます — 82fps・800x800 の動的シーンを数分で学習、canonical ガウシアンを時間で共有してストレージも控えめに。"
    limitations: "論文自身によれば、大きな動き、背景点の欠如、不正確なカメラ pose が 4D ガウシアンの最適化を難しくし、単眼動画では学習ビューに過学習して新規視点で破綻することがあります。"
