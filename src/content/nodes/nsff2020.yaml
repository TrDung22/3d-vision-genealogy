title: "Neural Scene Flow Fields for Space-Time View Synthesis of Dynamic Scenes"
short: "NSFF (2020)"
authors: "Zhengqi Li, Simon Niklaus, Noah Snavely, Oliver Wang"
venue: "CVPR 2021"
year: 2020
branch: dynamic-4d
lane: flow
links:
  arxiv: "https://arxiv.org/abs/2011.13084"
  paper: "https://openaccess.thecvf.com/content/CVPR2021/html/Li_Neural_Scene_Flow_Fields_for_Space-Time_View_Synthesis_of_Dynamic_CVPR_2021_paper.html"
  project: "https://www.cs.cornell.edu/~zl548/NSFF/"
  code: "https://github.com/zhengqili/Neural-Scene-Flow-Fields"
problem: >
  Most view synthesis assumed a static scene or a rig of synchronized
  cameras; most videos shared online have neither. NSFF wanted new views in
  space AND time from one monocular video with known poses, a problem
  "highly ill-posed since there can be multiple scene configurations that
  lead to the same observed image sequences". Using multi-view constraints
  on moving objects would first require the dense 3D motion of every point:
  the scene flow.
solution: >
  Give the radiance field a clock and a velocity. For each (point, time) an
  MLP returns color, density, forward and backward 3D scene flow, and
  disocclusion weights; each frame is volume-rendered again from its
  neighbors' scene, warped along the predicted flow, and must still match
  the input. Monocular depth and optical flow from pretrained networks keep
  early optimization out of bad minima, and a static NeRF, blended in,
  regains full multi-view constraints in rigid regions. New moments are
  rendered by splatting along the flow. In the dynamic regions of the Nvidia
  benchmark, PSNR rose from 17.34 (the best baseline) to 21.91.
limitations: >
  By its own account it is slow (about two days of training per scene on
  two V100s, some 6 s per 512x288 frame), cannot extrapolate content the
  input never saw, and degrades as sequences grow longer "given default
  number of model parameters" (most ran 1-2 seconds) or motion turns
  extreme. DynIBaR, from the same first author, later made this its target:
  NSFF "only claims good performance for 1-second, forward-facing videos".
  And its benchmark, by its own description, simulates a moving monocular
  camera by sampling a different rig camera at each instant, the
  teleportation DyCheck later flagged.
relations:
  - node: nerf2020
    type: fixes
    note: >
      Repairs the static-scene assumption NSFF diagnoses in NeRF and its
      kin: they "all assume a static scene with fixed appearance over time,
      and hence cannot model temporal changes or dynamic scenes". Building on
      NeRF ("prior work for static scenes"), it adds time and explicit
      forward/backward scene flow; NeRF's MLP, positional encoding and volume
      rendering carry over, and a NeRF variant stays inside the model as its
      static half.
status: seed
