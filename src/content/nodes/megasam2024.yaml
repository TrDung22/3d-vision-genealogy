title: "MegaSaM: Accurate, Fast, and Robust Structure and Motion from Casual Dynamic Videos"
short: "MegaSaM (2024)"
authors: "Zhengqi Li, Richard Tucker, Forrester Cole, Qianqian Wang, Linyi Jin, Vickie Ye, Angjoo Kanazawa, Aleksander Holynski, Noah Snavely (Google DeepMind, UC Berkeley, University of Michigan)"
venue: "CVPR 2025 (Oral, Best Paper Honorable Mention)"
year: 2024
branch: dynamic-4d
lane: monocular
links:
  arxiv: "https://arxiv.org/abs/2412.04463"
  paper: "https://openaccess.thecvf.com/content/CVPR2025/html/Li_MegaSaM_Accurate_Fast_and_Robust_Structure_and_Motion_from_Casual_CVPR_2025_paper.html"
  project: "https://mega-sam.github.io/"
  code: "https://github.com/mega-sam/mega-sam"
problem: >
  Cameras and depth from casual video of a dynamic scene. "Most
  conventional structure from motion and monocular SLAM techniques assume
  input videos that feature predominantly static scenes with large amounts
  of parallax"; handheld footage offers the opposite — "limited camera
  motion parallax (e.g., nearly stationary or rotational cameras)", a broad
  range of focal lengths, things moving. The remedies so far — fine-tuning
  depth networks or radiance fields per video, or fusing depth, flow,
  long-term tracks and motion masks in a global optimization — were
  computationally expensive, or brittle on long videos with unconstrained
  camera paths.
solution: >
  Go back to deep visual SLAM and teach it the hard cases. MegaSaM keeps
  DROID-SLAM's differentiable bundle adjustment — "such a learned layer is
  critical for achieving accurate and efficient camera pose estimation"
  for dynamic video — and adds an object-movement map that down-weights
  moving pixels inside BA (trained in a second stage on synthetic dynamic
  Kubric video, after static pretraining), focal length as a BA variable,
  and monocular depth priors: Depth Anything's disparity, scaled by
  UniDepth's metric depth, initializes every frame, and UniDepth's focal
  estimate initializes the camera. An uncertainty-aware global BA reads
  observability off the Hessian, leaning on the depth prior only when
  scant parallax leaves the cameras unobservable, and freezing focal
  length when it cannot be observed either. Consistent video depth then
  comes from a short optimization that fine-tunes no network. With focal
  length unknown, Sintel camera error (ATE) falls to 0.023, against 0.078
  for MonST3R and 0.067 for CasualSAM, at about a second per frame where
  CasualSAM takes 1.6 minutes — a CVPR 2025 Best Paper Honorable Mention.
limitations: >
  By its own account it can still fail "if moving objects dominate the
  entire image or if there is nothing for the system to track reliably",
  and it "cannot handle videos with varying focal lengths or strong radial
  distortion within the video". Its accuracy rests on borrowed priors:
  without the mono-depth initialization, Sintel camera error doubles, from
  0.019 to 0.038. The authors point to "better priors from current vision
  foundation models" as the way forward.
relations:
  - node: droidslam2021
    type: fixes
    note: >
      Repairs the weaknesses MegaSaM diagnoses in DROID-SLAM, whose
      differentiable bundle adjustment it is built on. Deep visual SLAM
      "works reasonably well for videos that feature static scenes and have
      sufficient camera translation, but its performance degrades when
      operating on videos of dynamic content, or videos with limited
      parallax"; DROID-SLAM "assumes known focal length", and its constant
      disparity initialization "fails to perform accurate camera tracking on
      videos with limited camera baselines and complex scene dynamics".
      MegaSaM adds movement maps, mono-depth initialization, focal-length
      optimization and an uncertainty-aware global BA; in its Sintel
      ablation, camera error (ATE) falls from 0.030 for vanilla DROID-SLAM
      to 0.019.
  - node: depthanything2024
    type: builds-on
    note: >
      Stands on Depth Anything for its depth prior, chosen because
      "DepthAnything provides more accurate and consistent depths": its
      per-frame disparity initializes every frame's disparity, in training
      (scaled with the ground-truth depth) and at inference (put in metric
      scale with UniDepth), and regularizes bundle adjustment where the
      camera motion leaves depth unobservable. Without that mono-depth
      initialization, Sintel camera error rises from 0.019 to 0.038.
  - node: unidepth2024
    type: builds-on
    note: >
      Stands on UniDepth for scale and camera: "UniDepth provides scene scale
      and shift estimates", so its metric depth sets the global scale and
      shift of Depth Anything's affine-invariant disparity, and its
      per-frame focal-length predictions, taken as a median over the video,
      give the initial focal length that bundle adjustment then refines
      wherever the video makes it observable — the intrinsics DROID-SLAM had
      to be given.
  - node: monst3r2024
    type: fixes
    note: >
      Repairs the failure MegaSaM diagnoses in MonST3R, which it calls
      concurrent work: on DAVIS videos with "rotation-dominant camera motion
      and narrow FoV", "MonST3R incorrectly treats rotational camera
      movement as translational one". Coupling a differentiable SLAM system
      with intermediate predictions of the dynamic scene, MegaSaM reports
      uncalibrated camera error (ATE) of 0.023 against 0.078 on Sintel,
      0.020 against 0.690 on DyCheck's iPhone videos and 0.004 against 0.073
      on in-the-wild footage, at the same speed or faster.
status: seed
