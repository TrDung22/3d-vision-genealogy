title: "LVSM: A Large View Synthesis Model with Minimal 3D Inductive Bias"
short: "LVSM (2024)"
authors: "Haian Jin, Hanwen Jiang, Hao Tan, Kai Zhang, Sai Bi, Tianyuan Zhang, Fujun Luan, Noah Snavely, Zexiang Xu (Cornell, Adobe, MIT, UT Austin)"
venue: "ICLR 2025 (Oral)"
year: 2024
branch: neural-rendering
lane: feedforward
links:
  arxiv: "https://arxiv.org/abs/2410.17242"
  code: "https://github.com/haian-jin/LVSM"
  project: "https://haian-jin.github.io/projects/LVSM/"
problem: >
  For decades view synthesis has smuggled in 3D machinery — ray marching,
  splatting, epipolar attention, cost volumes. Is any of it necessary, or is
  it all just inductive bias that data can replace?
solution: >
  A transformer that eats posed input-image tokens and EMITS novel-view
  pixels. The decoder-only variant keeps no 3D representation whatsoever —
  no NeRF, no Gaussians, no epipolar structure — and beats the 3D-biased
  state of the art by 1.5-3.5 dB, with quality improving as the model
  grows.
limitations: >
  No explicit 3D means nothing to edit and no guaranteed consistency across
  views; and, deterministic by its own account, it cannot hallucinate unseen
  regions, where it leaves "noisy and flickering artifacts" — the classic
  bitter-lesson trade of structure for learning, whose long-term verdict is
  still out.
relations:
  - node: mvsplat2024
    type: challenges
    note: >
      Challenges the premise of its own subfield: pixelSplat and MVSplat
      compete on BETTER 3D machinery, and LVSM outperforms both with none —
      arguing the geometry priors everyone was refining are training wheels
      that scale eventually removes.
    i18n:
      ja:
        note: "自らのサブ分野の前提を問い直します。pixelSplat と MVSplat が「より良い3Dの仕掛け」で競うなか、LVSM は仕掛けゼロで両者を上回る — 皆が磨いていた幾何 prior は、スケールがいずれ外す補助輪だ、と論じるのです。"
  - node: srt2021
    type: fixes
    note: >
      Repairs what LVSM diagnoses in the geometry-free renderers SRT stands
      among: they "lack model capacity and scalability, preventing them from
      capturing high-frequency detail" (SRT admits its blur), and in SRT it
      names "the CNN-based token extractor and the use of cross-attention in
      the decoder". LVSM patchifies its inputs and decodes with
      bidirectional self-attention; putting SRT's pure cross-attention
      decoder back costs 3.5 dB on GSO.
    i18n:
      ja:
        note: "LVSM が、SRT もその一つである幾何を使わないレンダラーに下した診断を直します。それらは「モデルの容量とスケーラビリティに欠け、高周波のディテールを捉えられない」(SRT 自身もぼやけを認めています)。SRT については「CNN ベースのトークン抽出器と、デコーダでのクロスアテンションの使用」を名指ししました。LVSM は入力をパッチに切り、双方向の self-attention でデコードします。SRT の純粋なクロスアテンション・デコーダに戻すと、GSO で 3.5 dB 落ちます。"
status: seed
i18n:
  ja:
    problem: "何十年ものあいだ、視点合成は3Dの仕掛け — レイマーチング、スプラッティング、epipolar アテンション、cost volume — を密輸してきました。そのどれかが本当に必要なのか、それともすべてデータが置き換えられる帰納バイアスにすぎないのか?"
    solution: "pose 付き入力画像のトークンを飲み込み、新規視点のピクセルを吐き出すトランスフォーマーです。デコーダのみの変種は3D表現を一切持たず — NeRF もガウシアンも epipolar 構造もなし — 3D バイアスを持つ最高水準を 1.5〜3.5 dB 上回り、品質はモデルを大きくするほど向上します。"
    limitations: "明示的な3Dがないということは、編集するものが何もなく、視点間の一貫性の保証もないということ。そして本人たちの言うとおり決定論的なモデルなので、見えない領域を補って描くことはできず、そこには「ノイズやちらつきのアーティファクト」が残ります — 構造を学習と引き換えにする古典的な bitter lesson の取引であり、その長期的な判決はまだ出ていません。"
