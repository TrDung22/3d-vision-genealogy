title: "Wonder3D: Single Image to 3D using Cross-Domain Diffusion"
short: "Wonder3D (2023)"
authors: "Xiaoxiao Long, Yuan-Chen Guo, Cheng Lin, Yuan Liu, et al."
venue: "CVPR 2024 (Highlight)"
year: 2023
branch: single-image-3d
lane: generative
links:
  arxiv: "https://arxiv.org/abs/2310.15008"
  code: "https://github.com/xxlong0/Wonder3D"
problem: >
  Generated RGB views alone underconstrain geometry: even consistent-looking
  images can hide a mushy, ambiguous surface.
solution: >
  Make the diffusion model output geometry directly alongside appearance: a
  cross-domain diffusion generates paired normal maps AND color images for
  multiple views, with cross-domain attention keeping the two aligned; a
  geometry-aware fusion then lifts them to a textured mesh in minutes.
limitations: >
  Fixed sparse view set and modest resolution; normal-map supervision helps
  surfaces, but with only six views, the authors note, very thin structures
  and severe occlusions are hard to reconstruct; per-object fusion remains an
  optimization step.
relations:
  - node: zero123-2023
    type: fixes
    note: >
      Repairs the weakness it names in Zero123 — its images "lack multi-view
      consistency since it operates on each view independently" — by
      generating all views jointly with multi-view attention, and widens the
      output: predicting normals with colors gives reconstruction an explicit
      geometric anchor that RGB-only imagination lacked.
  - node: syncdreamer2023
    type: fixes
    note: >
      Six and a half weeks later, it follows SyncDreamer into multiview
      generation and repairs the weakness it diagnoses there: working from
      color images alone, SyncDreamer "requires dense views for 3D
      reconstruction, but still suffers from low-quality geometry and blurring
      textures". Generating normal maps alongside colors gives the
      reconstruction explicit geometry from just six views.
status: seed
