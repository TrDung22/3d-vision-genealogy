title: "Depth Anything 3: Recovering the Visual Space from Any Views"
short: "Depth Anything 3 (2025)"
authors: "ByteDance Seed (Haotong Lin, Sili Chen, et al.)"
venue: "ICLR 2026"
year: 2025
branch: single-image-3d
lane: depth
links:
  arxiv: "https://arxiv.org/abs/2511.10647"
  code: "https://github.com/ByteDance-Seed/depth-anything-3"
problem: >
  Two lanes had quietly become one problem: single-image depth models and
  multi-view geometry transformers (VGGT) were solving the same "recover visual
  space" task with incompatible architectures and task-specific heads.
solution: >
  Radical minimalism: one plain transformer (a vanilla DINO encoder, no
  architectural specialization) and one prediction target (depth-ray),
  handling 1 to N views with or without poses. Teacher-student training keeps
  DA2-level detail; a new visual-geometry benchmark shows it beating VGGT by
  44.3% on camera pose and 25.1% on geometric accuracy.
limitations: >
  The unification is empirical, not conceptual — why a single depth-ray target
  suffices remains under-analyzed; and monocular metric scale still comes from
  the teacher lineage rather than being solved anew.
relations:
  - node: depthanythingv2-2024
    type: builds-on
    note: >
      Third generation of the line: keeps V2's teacher-student recipe and
      detail quality, but generalizes the task from one image to any number of
      views.
    i18n:
      ja:
        note: "路線の第三世代です。V2 の teacher-student レシピとディテール品質を保ちながら、タスクを一枚の画像から任意本数の視点へ一般化しました。"
  - node: vggt2025
    type: fixes
    note: >
      Simplifies away VGGT's multi-task head zoo — one plain transformer with a
      single depth-ray target beats it by 44.3% (pose) and 25.1% (geometry).
      The depth lane and the scene lane formally merge here.
    i18n:
      ja:
        note: "VGGT のマルチタスクヘッドの動物園を片付けました — 素のトランスフォーマー + 単一の depth-ray ターゲットが、姿勢で 44.3%、幾何で 25.1% 勝ってしまったのです。深度レーンとシーンレーンは、ここで正式に合流します。"
status: seed
i18n:
  ja:
    problem: "二つのレーンは、いつの間にか同じ問題になっていました。単一画像の深度モデルと多視点幾何トランスフォーマー (VGGT) が、互換性のないアーキテクチャとタスク別ヘッドで、同じ「視覚空間の復元」を解いていたのです。"
    solution: "徹底したミニマリズムです。素のトランスフォーマー一つ (vanilla な DINO エンコーダ、アーキテクチャの特殊化なし) と予測ターゲット一つ (depth-ray) で、ポーズの有無を問わず 1〜N 視点を扱います。teacher-student 学習で DA2 級のディテールを保ち、新しい視覚幾何ベンチマークでは VGGT をカメラ姿勢で 44.3%、幾何精度で 25.1% 上回りました。"
    limitations: "この統一は経験的なもので、概念的な説明はまだありません — なぜ depth-ray という単一ターゲットで足りるのかは十分に分析されておらず、単眼の metric スケールも teacher の血統頼みで、新たに解かれたわけではないのです。"
