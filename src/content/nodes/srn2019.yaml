title: "Scene Representation Networks: Continuous 3D-Structure-Aware Neural Scene Representations"
short: "SRN (2019)"
authors: "Vincent Sitzmann, Michael Zollhöfer, Gordon Wetzstein"
venue: "NeurIPS 2019 (Oral, Outstanding New Directions Paper Honorable Mention)"
year: 2019
branch: neural-rendering
lane: scene-reps
links:
  arxiv: "https://arxiv.org/abs/1906.01618"
  code: "https://github.com/vsitzmann/scene-representation-networks"
  project: "https://www.scenerepresentations.org/publications/srns/"
problem: >
  GQN showed scenes can be learned from images alone, but its flat latent
  vector has no notion of space — nothing guarantees the same wall looks the
  same from two viewpoints.
solution: >
  Make the representation a continuous FUNCTION of 3D coordinates: an MLP
  maps (x, y, z) to features, and a learned differentiable ray marcher
  renders it — 3D structure and multi-view consistency baked into the
  architecture, trained from posed 2D images only.
limitations: >
  The learned LSTM ray marcher is fragile — by its own account it can "get
  stuck" in holes or on rays grazing occluders — and results are blurry:
  NeRF found SRN "unable to reproduce any fine detail", the weakness of ReLU
  coordinate MLPs that SIREN and Fourier features later attacked. It renders
  one opaque surface point per ray and, as the paper itself states, models
  no view- or lighting-dependent effects and reconstructs shape and
  appearance in an entangled manner. One year later NeRF kept the
  coordinate-MLP and swapped the learned marcher for fixed volume rendering.
relations:
  - node: gqn2018
    type: fixes
    note: >
      Repairs GQN's structureless latent: replaces the flat vector with a
      coordinate function and the learned black-box decoder with a ray
      marcher that walks camera rays through it, so multi-view consistency
      comes from geometry, not hope.
  - node: deepsdf2019
    type: independent
    note: >
      The third front of the 2019 implicit wave: DeepSDF and Occupancy
      Networks hit continuous coordinate-MLPs for SHAPE; SRN hit the same
      representation for appearance + rendering, simultaneously and
      independently — from supervision by posed images instead of 3D data.
status: seed
