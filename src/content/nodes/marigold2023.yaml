title: "Repurposing Diffusion-Based Image Generators for Monocular Depth Estimation"
short: "Marigold (2023)"
authors: "Bingxin Ke, Anton Obukhov, Shengyu Huang, Nando Metzger, Rodrigo Caye Daudt, Konrad Schindler"
venue: "CVPR 2024 (Oral, Best Paper Award Candidate)"
year: 2023
branch: single-image-3d
lane: depth
links:
  arxiv: "https://arxiv.org/abs/2312.02145"
  code: "https://github.com/prs-eth/Marigold"
  project: "https://marigoldmonodepth.github.io/"
problem: >
  Achieve generalization WITHOUT hoarding millions of depth-labeled images —
  because label-hoarding is a race with no finish line.
solution: >
  Borrow the visual "understanding" already inside Stable Diffusion: lightly
  fine-tune the image generator into a depth generator, using only a small
  synthetic dataset — the prior comes not from depth labels but from having
  seen billions of internet images.
limitations: >
  Slow (in the paper's setting, 50 denoising steps ensembled over 10 runs per
  depth map) and still affine-invariant (relative) depth; by its own account, inference
  efficiency, consistency across similar inputs, and distant scene parts
  remain open.
relations:
  - node: dpt2021
    type: fixes
    note: >
      Fixes the weakness Marigold names in the MiDaS/DPT line: however large
      the model, its "knowledge of the visual world is restricted by the data
      seen during training". The fix borrows Stable Diffusion's internet-scale
      prior instead: fine-tuned on only 74K synthetic samples, it beats DPT
      (1.2M real + 188K synthetic training images) on four of five zero-shot
      benchmarks.
status: seed
