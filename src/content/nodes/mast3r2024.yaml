title: "Grounding Image Matching in 3D with MASt3R"
short: "MASt3R (2024)"
authors: "Vincent Leroy, Yohann Cabon, Jerome Revaud (Naver Labs Europe)"
venue: "ECCV 2024 (Oral)"
year: 2024
branch: multi-view-geometry
lane: feedforward
links:
  arxiv: "https://arxiv.org/abs/2406.09756"
  paper: "https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/9080_ECCV_2024_paper.php"
  code: "https://github.com/naver/mast3r"
problem: >
  Image matching, the first stage of nearly every 3D pipeline, was still
  solved in 2D: keypoints described patch by patch, or — since LoFTR — whole
  images matched by attention. Even LoFTR scored "a relatively disappointing
  VCRE precision of 34%" on the Map-free relocalization benchmark, where a
  camera must be placed from a single reference image and no map, across
  viewpoint changes of up to 180°. DUSt3R had shown another route: by
  MASt3R's account, matches read off its 3D pointmaps topped that
  leaderboard and shrugged off extreme viewpoint changes, but they were
  "relatively imprecise".
solution: >
  Ground the matching in 3D. MASt3R starts from DUSt3R's checkpoint, keeps
  its pointmap head (now metric wherever the ground truth is), and attaches
  a second head that regresses a dense local feature per pixel, trained with
  an InfoNCE loss that rewards only the right pixel, "not a nearby pixel". A
  fast reciprocal matcher — nearest neighbours iterated from a sparse grid,
  keeping the pairs that close a cycle — runs 64 times faster than full
  matching at k = 3000 and is more accurate for it; overlapping 512-pixel
  windows carry the matches to full resolution. Trained on a mix of 14
  datasets, it lifts the VCRE AUC on the Map-free test set to 0.933, against
  0.748 for the best prior method (MicKey) and 0.634 for LoFTR.
limitations: >
  By its own account it stays binocular: DUSt3R's global alignment goes
  unused — "we do not make use of this step and restrict ourselves to the
  binocular case" — and quadratic attention caps its input at 512 pixels, so
  large images must be cut into windows. Pose read straight off the
  regressed pointmap, without matching, is "rather poor" on the large Aachen
  and InLoc scenes. VGGT later charged it with DUSt3R's debt: these networks
  "can only process two images at once and rely on post-processing to
  reconstruct more images, fusing pairwise reconstructions".
relations:
  - node: dust3r2023
    type: fixes
    note: >
      Repairs the flaw MASt3R names in DUSt3R: matches read off its regressed
      pointmaps survive extreme viewpoint changes, yet "the resulting
      correspondences are rather imprecise" — regression is noisy, and
      "DUSt3R was never explicitly trained for matching". MASt3R starts from
      DUSt3R's weights and adds a head of local features trained to match.
      All else equal, matching those features beats matching its own 3D
      points, which the authors take as confirmation that "regression is
      inherently unsuited to compute pixel correspondences".
  - node: loftr2021
    type: challenges
    note: >
      Questions the framing LoFTR shares with "practically all matching
      approaches", which "have been treating matching as a 2D problem in
      image space", whereas "pixels that correspond are pixels that observe
      the same 3D point". MASt3R blames that framing for LoFTR's "relatively
      disappointing" Map-free score and tests it there: VCRE precision is
      34.3% for LoFTR, 54.2% for MASt3R with borrowed DPT depth for scale,
      79.3% with its own metric depth. On Aachen Day-Night, by its own
      account, it is only "competitive".
