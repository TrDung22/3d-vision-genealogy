title: "Multiview Neural Surface Reconstruction by Disentangling Geometry and Appearance"
short: "IDR (2020)"
authors: "Lior Yariv, Yoni Kasten, Dror Moran, Meirav Galun, Matan Atzmon, Ronen Basri, Yaron Lipman (Weizmann)"
venue: "NeurIPS 2020 (Spotlight)"
year: 2020
branch: neural-rendering
lane: surfaces
links:
  arxiv: "https://arxiv.org/abs/2003.09852"
  project: "https://lioryariv.github.io/idr/"
  code: "https://github.com/lioryariv/idr"
problem: >
  DVR had fitted an implicit surface to images, but differentiable
  renderers for neural implicit surfaces, IDR observes, "did not
  incorporate lighting and reflectance properties required for producing
  faithful appearance of 3D geometry in images, nor did they deal with
  trainable camera locations and orientations". Real objects shine and
  real cameras are known only roughly; without the viewing direction, the
  normal or a global feature, IDR's ablation finds, a model "tends to
  confuse lighting and geometry".
solution: >
  Make the pixel color a differentiable function of all three unknowns:
  geometry, appearance and cameras. The geometry is the zero level set of
  an SDF network, kept a distance function by IGR's Eikonal term and
  ray-cast by sphere tracing; the ray's first hit is rewritten so that its
  value and first derivatives are exact in the network weights and the
  camera parameters alike. The color comes from a second MLP, derived from
  the rendering equation, that sees the point, its normal, the viewing
  direction and a global geometry feature. The normal is what lets
  geometry and appearance come apart: a renderer trained on one scene can
  shade another's geometry. From masked images and fixed cameras it
  reaches a mean Chamfer distance of 0.90 on 15 DTU scans, and it can
  refine noisy cameras as it trains.
limitations: >
  By its own account it "requires a reasonable camera initialization and
  cannot work with, say random camera initialization", and it learns from
  masked images; with trained cameras, scan 97 fails. The 2021 papers that
  dropped the masks diagnosed why IDR needed them. UNISURF found its one
  good unmasked run "the only successful case out of several failure
  cases"; NeuS traced its failures at abrupt depth changes to a gradient
  that "only exists at this single point" where the ray meets the surface;
  VolSDF, from IDR's own first author, blamed the same single point for
  local minima that sometimes appear as "extraneous surface parts".
relations:
  - node: dvr2019
    type: fixes
    note: >
      Repairs the renderer of the work IDR names as its closest relative:
      DVR colors a pixel from the surface point alone, and IDR's verdict is
      that "it cannot handle general appearance models, nor can it handle
      unknown, noisy camera locations". IDR's intersection formula
      "unifies" DVR's differentiable depth with Atzmon et al.'s sample
      network and extends it to the camera parameters, and its renderer
      adds the normal and the viewing direction. On 15 DTU scans with fixed
      cameras, the mean Chamfer distance falls from DVR's 3.20 (2.28 on the
      reduced image set DVR suggested) to 0.90.
    i18n:
      ja:
        note: "IDR が最も近い先行研究として名を挙げる DVR の、そのレンダラーを直します。DVR はピクセルの色を表面上の点だけから決めており、IDR の判定は「一般的な見た目のモデルを扱えず、未知の、ノイズを含むカメラ位置も扱えない」というものです。IDR の交点の式は、DVR の微分可能な深度と Atzmon らの sample network を「統一し」、カメラのパラメータにまで広げたもので、レンダラーには法線と視線方向が加わりました。固定カメラの DTU 15スキャンで、平均 Chamfer 距離は DVR の 3.20 (DVR が勧める、画像を減らした設定では 2.28) から 0.90 に下がりました。"
  - node: deepsdf2019
    type: builds-on
    note: >
      A cross-branch graft: the geometry is a signed distance function,
      cited to DeepSDF, in DeepSDF's network shape (eight 512-wide layers,
      with a skip connection from the input to the middle layer). What
      DeepSDF fitted to 3D shapes, IDR fits to masked images through sphere
      tracing.
    i18n:
      ja:
        note: "枝をまたぐ接ぎ木です。幾何は DeepSDF を引いた符号付き距離関数で、ネットワークの形も DeepSDF のもの (幅512の8層、入力から中間層へのスキップ接続) です。DeepSDF が3D形状に当てはめたものを、IDR は sphere tracing を通してマスク付きの画像に当てはめます。"
status: seed
i18n:
  ja:
    problem: "DVR は陰関数の表面を画像に当てはめてみせました。しかし IDR の見立てでは、ニューラル陰関数表面のための微分可能レンダラーは「画像の中で3D幾何の見た目を忠実に再現するのに必要な照明と反射の性質を取り入れておらず、学習可能なカメラの位置と向きも扱っていなかった」のです。実物は光沢を帯び、実際のカメラはおおよそしかわかりません。IDR のアブレーションが示すように、視線方向、法線、大域的な特徴のどれかを欠くと、モデルは「照明と幾何を取り違えがち」になります。"
    solution: "ピクセルの色を、三つの未知数 — 幾何、見た目、カメラ — すべての微分可能な関数にします。幾何は SDF ネットワークのゼロ等値面で、IGR の Eikonal 項によって距離関数に保たれ、sphere tracing でレイキャストされます。光線と表面の最初の交点は、その値と一階微分がネットワークの重みについてもカメラのパラメータについても正確になるよう書き直されます。色は、レンダリング方程式から導かれた二つ目の MLP が、点、その法線、視線方向、そして大域的な幾何の特徴を見て決めます。幾何と見た目を切り離すのは法線です — あるシーンで学習したレンダラーで、別のシーンの幾何に陰影を付けられます。マスク付きの画像と固定カメラから、DTU の15スキャンで平均 Chamfer 距離 0.90 を達成し、学習しながらノイズを含むカメラを補正することもできます。"
    limitations: "本人たちの言うとおり、「妥当なカメラの初期値を必要とし、たとえばランダムな初期値では動かない」うえ、学習にはマスク付きの画像を使います。カメラも学習する設定では、スキャン97で失敗します。なぜ IDR にマスクが要ったのかは、マスクを捨てた2021年の論文たちが診断しました。UNISURF によれば、マスクなしでうまくいった IDR の一例は「いくつもの失敗例の中で唯一の成功例」でした。NeuS は、急な深度変化での失敗を、光線が表面と交わる「この一点にしか存在しない」勾配にたどりました。そして IDR の第一著者自身による VolSDF は、同じ一点が局所解を招き、それがときに「余計な表面の断片」として現れると指摘しました。"
