title: "MonST3R: A Simple Approach for Estimating Geometry in the Presence of Motion"
short: "MonST3R (2024)"
authors: "Junyi Zhang, Charles Herrmann, Junhwa Hur, Varun Jampani, Trevor Darrell, Forrester Cole, Deqing Sun, Ming-Hsuan Yang (UC Berkeley, Google DeepMind, Stability AI, UC Merced)"
venue: "ICLR 2025 (Spotlight)"
year: 2024
branch: dynamic-4d
lane: monocular
links:
  arxiv: "https://arxiv.org/abs/2410.03825"
  paper: "https://openreview.net/forum?id=lJpqxFgWCM"
  project: "https://monst3r-project.github.io/"
  code: "https://github.com/Junyi42/monst3r"
problem: >
  Geometry from a video of a moving scene — cameras, depth, a point cloud,
  while things move. The usual route split the problem into depth, optical
  flow or trajectories and stitched the pieces back with global
  optimization, and such multi-stage methods "are usually slow, brittle,
  and prone to error at each step". DUSt3R had shown that geometry can be
  regressed directly, but only for static scenes: trained on static data,
  it often aligns a pair of frames on the moving foreground and misplaces
  the background. And the posed, depth-labelled dynamic video needed to
  retrain it is scarce.
solution: >
  Keep DUSt3R's pointmaps, but tie each one to a single timestep: a pair of
  frames yields two pointmaps in the first camera's frame, and a moving
  object simply appears wherever it was. MonST3R starts from DUSt3R's
  weights, freezes the encoder and fine-tunes decoder and heads on four
  posed, depth-labelled video datasets — synthetic PointOdyssey, TartanAir
  and Spring plus real Waymo driving — with frame strides of 1 to 9 and
  field-of-view augmentation: a day on two GPUs. Downstream, intrinsics
  come from the pointmap, relative pose from PnP and RANSAC, static masks
  from where optical flow disagrees with the flow camera motion alone would
  induce, and a sliding-window global alignment (DUSt3R's loss plus camera
  smoothness and flow projection) yields per-frame cameras and a dynamic
  point cloud. On Sintel its camera error (ATE) is 0.108, against 0.417 for
  DUSt3R given ground-truth motion masks and 0.175 for DROID-SLAM given
  ground-truth intrinsics.
limitations: >
  By its own account it can in theory handle changing intrinsics, but "in
  practice, this requires careful hyperparameter tuning or manual
  constraints"; its small sliding window leaves it "vulnerable to long-term
  occlusion"; and it "struggles with out-of-distribution inputs, such as
  open fields". It still thinks in pairs, fused by an optimization. MegaSaM,
  released two months later and calling it concurrent work, found that it
  "incorrectly treats rotational camera movement as translational one",
  and measured its camera error on DyCheck's handheld iPhone videos at
  0.690, against 0.020 for its own.
relations:
  - node: dust3r2023
    type: fixes
    note: >
      Repairs the two limitations MonST3R identifies "stemming from the
      distribution of DUSt3R's training data". Trained only on static
      scenes, DUSt3R "fails to correctly align pointmaps of scenes with
      moving objects", often aligning on the moving foreground and
      misaligning the background; trained mostly on buildings and
      backgrounds, it "sometimes fails to correctly estimate the geometry of
      foreground objects" and places them in the background. MonST3R keeps
      DUSt3R's network and weights and fine-tunes decoder and heads on
      dynamic video. On Sintel camera pose, DUSt3R reaches an ATE of 0.417
      even when given ground-truth motion masks; MonST3R, 0.108.
