title: "MoGe: Unlocking Accurate Monocular Geometry Estimation for Open-Domain Images with Optimal Training Supervision (MoGe-2: NeurIPS 2025)"
short: "MoGe / MoGe-2 (2024)"
authors: "Ruicheng Wang, Sicheng Xu, et al. (Microsoft Research)"
venue: "CVPR 2025 (Oral) → NeurIPS 2025 (MoGe-2)"
year: 2024
branch: single-image-3d
lane: depth
links:
  arxiv: "https://arxiv.org/abs/2410.19115"
  moge-2: "https://arxiv.org/abs/2507.02546"
  code: "https://github.com/microsoft/MoGe"
problem: >
  A depth map is not geometry: it hides the camera, entangles focal length with
  shape, and needs post-hoc intrinsics to become a point cloud anyone can use.
solution: >
  Change the prediction target itself: regress an affine-invariant POINT MAP —
  full 3D geometry plus recoverable FOV in one forward pass — trained with an
  optimal affine-alignment supervision that the depth-map line lacked. MoGe-2
  (NeurIPS 2025) adds a decoupled global-scale branch for metric output and a
  data-refinement pipeline that filters and completes noisy LiDAR/SfM labels,
  claiming the first simultaneous win on relative geometry, metric scale, and
  fine detail.
limitations: >
  Still single-image and static; the affine-invariant trick defers but does not
  eliminate the scale question (the metric branch is a separate head); and the
  self-reported claim to capabilities "no previous methods have simultaneously
  achieved" rests on benchmark averages, not a new theory of the ambiguity.
relations:
  - node: depthanythingv2-2024
    type: fixes
    note: >
      Moves the goalposts of the whole depth lane: Depth Anything V2 predicts
      depth maps that, in MoGe's words, "require ground truth camera focal to
      obtain 3D points cloud results". MoGe predicts the point map itself,
      camera geometry built in, and trains it with an optimal alignment solver
      where earlier scale-and-shift alignment was outlier-prone or approximate.
    i18n:
      ja:
        note: "深度レーン全体のゴールポストを動かしました。Depth Anything V2 が予測するのは深度マップで、MoGe の言葉を借りれば「3D点群の結果を得るには ground truth のカメラ焦点距離が必要」です。MoGe は点マップそのものをカメラ幾何ごと予測し、従来のスケール・シフト整列が外れ値に弱いか近似どまりだったところを、最適な整列ソルバーで学習します。"
  - node: depthpro2024
    type: fixes
    note: >
      MoGe-2 names the weakness: Depth Pro sharpens depth maps "but still
      falls short in geometric accuracy", having trained its second stage on
      synthetic data only. MoGe-2 keeps real data throughout — filtering out
      its false depth values — and recovers metric point maps with sharp
      detail as well.
    i18n:
      ja:
        note: "MoGe-2 が弱点を名指しします。Depth Pro は深度マップを鮮明にした「が、幾何の精度ではなお及ばない」 — 第2段階を合成データだけで学習したためです。MoGe-2 は誤った深度値を除きながら実データを最後まで使い、鋭いディテールまで備えた metric な点マップを復元します。"
status: seed
i18n:
  ja:
    problem: "深度マップはまだ幾何ではありません。カメラを隠し、焦点距離と形状を絡ませ、誰もが使える点群にするには後付けの内部パラメータが要るのです。"
    solution: "予測ターゲットそのものを替えます。アフィン不変の点マップを回帰する — 一回の forward で完全な3D幾何と復元可能な FOV が同時に手に入り、深度マップ路線に欠けていた最適なアフィン整列の教師信号で学習します。MoGe-2 (NeurIPS 2025) は metric 出力用に切り離したグローバルスケール分岐と、ノイズだらけの LiDAR/SfM ラベルを選別・補完するデータ精錬パイプラインを加え、相対幾何・metric スケール・微細ディテールの三つを初めて同時に取ったと主張します。"
    limitations: "依然として単一画像かつ静的です。アフィン不変の技はスケール問題を先送りするだけで消しはせず (metric 分岐は別ヘッド)、「これまでどの手法も同時には達成していない」という自己申告の主張も benchmark 平均の話であって、曖昧性への新しい理論ではありません。"
