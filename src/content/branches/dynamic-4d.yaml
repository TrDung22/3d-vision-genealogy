title: "Dynamic Scenes & 4D"
tagline: "Adding time — from deformation fields to 4D reconstruction from a single casual video"
description: >
  Everything in the other branches holds still. This one adds time: a scene
  that moves, seen by a camera that never sees the same instant twice. The
  first answers (2020) bent NeRF around a canonical space with a learned
  deformation, or let it flow through time with scene-flow fields; factorized
  spacetime planes and dynamic Gaussians then made 4D fast. DyCheck's audit
  showed how much the early demos leaned on easy, teleporting cameras — and
  the field's answer was priors: point tracks, monocular depth and
  DUSt3R-style pointmaps, fused into 4D reconstructions of a single casual
  video. Generation followed the same path, distilling video models into 4D.
color: "#008300" # categorical slot 4 (dark)
order: 4
status: active
