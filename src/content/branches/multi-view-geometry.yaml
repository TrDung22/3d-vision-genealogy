title: "Multi-View Geometry"
tagline: "Cameras and 3D from many photographs — from the essential matrix to feed-forward pointmaps"
description: >
  The oldest machinery in 3D vision: recover the cameras and the scene from
  overlapping images. For four decades it was a pipeline of hand-built stages
  — two-view geometry (1981), invariant features (SIFT), incremental
  structure from motion (Photo Tourism → COLMAP), dense multi-view stereo —
  each stage handing its errors to the next. Learning entered one stage at a
  time (learned features and matching, learned stereo, learned SLAM), then
  swallowed the pipeline whole: DUSt3R (2023) regresses 3D pointmaps from an
  image pair with no cameras at all, and VGGT (2025) predicts cameras and
  geometry for hundreds of views in one forward pass. The other branches lean
  on it quietly — NeRF and 3DGS take their camera poses from COLMAP.
color: "#c98500" # categorical slot 3 (dark)
order: 3
